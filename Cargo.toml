[workspace]
resolver = "2"
members = [
    "api",
    "block-client",
    "metering",
    "blockd",
    "storage",
    "adapters/object-store-file",
    "adapters/object-store-aws-s3",
    "adapters/object-store-gateway",
    "adapters/host-fence-aws",
    "adapters/metadata-store-sqlite",
    "adapters/metadata-store-postgres",
    "adapters/usage-store-postgres",
    "adapters/usage-store-aws-stream",
    "control-plane",
    "node-agent",
    "guest",
    "network",
    "cmd/cats",
    "cmd/blockd",
    "cmd/controld",
    "cmd/object-write-gatewayd",
    "cmd/host-fence-providerd",
    "cmd/noded",
    "tests/support",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/ahuazhu/cats"

[workspace.dependencies]
cats-api = { version = "=0.1.1", path = "api" }
cats-block-client = { path = "block-client" }
cats-metering = { path = "metering" }
cats-blockd = { path = "blockd" }
cats-storage = { path = "storage" }
cats-object-store-file = { path = "adapters/object-store-file" }
cats-object-store-aws-s3 = { path = "adapters/object-store-aws-s3" }
cats-object-store-gateway = { path = "adapters/object-store-gateway" }
cats-host-fence-aws = { path = "adapters/host-fence-aws" }
cats-metadata-store-sqlite = { path = "adapters/metadata-store-sqlite" }
cats-metadata-store-postgres = { path = "adapters/metadata-store-postgres" }
cats-usage-store-postgres = { path = "adapters/usage-store-postgres" }
cats-usage-store-aws-stream = { path = "adapters/usage-store-aws-stream" }
cats-control-plane = { path = "control-plane" }
cats-node-agent = { path = "node-agent" }
cats-guest-agent = { path = "guest" }
cats-network = { path = "network" }
cats-test-support = { path = "tests/support" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
    "process",
    "signal",
    "io-std",
] }
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-ring = { package = "rustls", version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
postgres = "0.19.14"
native-tls = "0.2"
postgres-native-tls = "0.5.3"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
base64 = "0.22"
ring = "0.17"
rand = "0.9"
libc = "0.2"
tempfile = "3"
loom = "0.7"
workos = "2.5"
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs", "use_pem"] }
directories = "6"
keyring = "4.1"
open = "5.4"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tungstenite = "0.29"
portable-pty = "0.9"
fs2 = "0.4"
xmlparser = "0.13"
flate2 = "1"
tar = "0.4"
zstd = "0.13"
aws-config = "1"
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ec2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kinesis = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }

# rust-vmm ecosystem (Linux-only data plane: vhost-user-blk frontend, ADR-0004).
vhost = "0.17"
vhost-user-backend = "0.23"
virtio-bindings = "0.2"
virtio-queue = "0.18"
vm-memory = { version = "0.18", features = ["backend-mmap", "backend-atomic"] }
vmm-sys-util = "0.15"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
large_futures = "warn"
large_stack_arrays = "warn"

[profile.release]
debug = true
