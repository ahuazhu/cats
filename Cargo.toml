[workspace]
resolver = "2"
members = [
    "api",
    "blockd",
    "storage",
    "adapters/object-store-file",
    "adapters/object-store-aws-s3",
    "adapters/metadata-store-sqlite",
    "control-plane",
    "node-agent",
    "guest",
    "network",
    "cmd/cats",
    "cmd/blockd",
    "cmd/controld",
    "cmd/noded",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
cats-api = { path = "api" }
cats-blockd = { path = "blockd" }
cats-storage = { path = "storage" }
cats-object-store-file = { path = "adapters/object-store-file" }
cats-object-store-aws-s3 = { path = "adapters/object-store-aws-s3" }
cats-metadata-store-sqlite = { path = "adapters/metadata-store-sqlite" }
cats-control-plane = { path = "control-plane" }
cats-node-agent = { path = "node-agent" }
cats-guest-agent = { path = "guest" }
cats-network = { path = "network" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
    "process",
    "signal",
] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
base64 = "0.22"
rand = "0.9"
libc = "0.2"
tempfile = "3"
workos = "2.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = true
