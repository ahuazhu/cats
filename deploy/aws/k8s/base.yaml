# LEGACY MIGRATION REFERENCE ONLY.
# Production ownership moved to deploy/aws/terraform/modules/cats-kubernetes.
# Import the live objects into Terraform; do not apply this file again.
apiVersion: v1
kind: Namespace
metadata:
  name: cats
  labels:
    cats.run/ingress: enabled
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cats-auto-ebs
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
allowedTopologies:
  - matchLabelExpressions:
      - key: eks.amazonaws.com/compute-type
        values: [auto]
parameters:
  type: gp3
  encrypted: "true"
  tagSpecification_1: Project=Cats
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cats-control-data
  namespace: cats
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cats-auto-ebs
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cats-controld
  namespace: cats
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cats-controld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cats-controld
        app.kubernetes.io/part-of: cats
    spec:
      # Must remain shorter than the Node lease. cats-controld handles SIGTERM
      # and exits immediately; this bound also fails closed if that regresses.
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: controld
          image: cats-control-plane:local
          imagePullPolicy: IfNotPresent
          args:
            - --listen
            - 0.0.0.0:7300
            - --db-path
            - /var/lib/cats/control/control.db
            - --metadata-store-adapter
            - postgres
            - --metadata-store-option
            - ca-file=/etc/cats/rds-ca.pem
          env:
            - name: CATS_AUTO_WARM_AFTER_SECONDS
              value: "600"
            - name: CATS_AUTO_COLD_AFTER_SECONDS
              value: "86400"
          envFrom:
            - secretRef:
                name: cats-runtime
          ports:
            - name: http
              containerPort: 7300
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: control-data
              mountPath: /var/lib/cats/control
            - name: rds-ca
              mountPath: /etc/cats/rds-ca.pem
              subPath: rds-ca.pem
              readOnly: true
      volumes:
        - name: control-data
          persistentVolumeClaim:
            claimName: cats-control-data
        - name: rds-ca
          configMap:
            name: cats-rds-ca
---
apiVersion: v1
kind: Service
metadata:
  name: cats-controld
  namespace: cats
spec:
  selector:
    app.kubernetes.io/name: cats-controld
  ports:
    - name: http
      port: 7300
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cats-gatewayd
  namespace: cats
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cats-gatewayd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cats-gatewayd
        app.kubernetes.io/part-of: cats
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: gatewayd
          image: cats-control-plane:local
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/cats-gatewayd]
          args:
            - --listen
            - 0.0.0.0:7400
            - --control-plane-url
            - http://cats-controld:7300
          envFrom:
            - secretRef:
                name: cats-runtime
          ports:
            - name: http
              containerPort: 7400
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: cats-gatewayd
  namespace: cats
spec:
  selector:
    app.kubernetes.io/name: cats-gatewayd
  ports:
    - name: http
      port: 7400
      targetPort: http
