[package]
name = "cats-guest-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cats-guest-agent"
path = "src/main.rs"

[[bin]]
name = "cats-guest-work"
path = "src/work_main.rs"

[[bin]]
name = "cats-e3-guest-workload"
path = "src/e3_workload.rs"

[dependencies]
cats-protocol = { workspace = true }
cats-block-client = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
portable-pty = { workspace = true }
tungstenite = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
