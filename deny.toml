[graph]
all-features = true

[advisories]
ignore = []

[licenses]
include-dev = true
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

# `option-ext` is an indirect, source-only dependency of the cross-platform
# directories crate. Keep the weak-copyleft exception scoped to this version.
exceptions = [
  { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"

# Baseline the workspace's current transitive version splits with exact
# versions. Any new split fails the gate; remove entries as upstreams converge.
skip = [
  { crate = "bitflags@1.3.2", reason = "existing transitive version split" },
  { crate = "block-buffer@0.10.4", reason = "existing transitive version split" },
  { crate = "const-oid@0.9.6", reason = "existing transitive version split" },
  { crate = "cpufeatures@0.2.17", reason = "existing transitive version split" },
  { crate = "crypto-common@0.1.7", reason = "existing transitive version split" },
  { crate = "digest@0.10.7", reason = "existing transitive version split" },
  { crate = "fallible-iterator@0.2.0", reason = "existing transitive version split" },
  { crate = "getrandom@0.2.17", reason = "existing transitive version split" },
  { crate = "getrandom@0.3.4", reason = "existing transitive version split" },
  { crate = "hashbrown@0.16.1", reason = "existing transitive version split" },
  { crate = "hmac@0.12.1", reason = "existing transitive version split" },
  { crate = "http@0.2.12", reason = "existing transitive version split" },
  { crate = "http-body@0.4.6", reason = "existing transitive version split" },
  { crate = "r-efi@5.3.0", reason = "existing transitive version split" },
  { crate = "rand@0.9.5", reason = "existing transitive version split" },
  { crate = "rand_core@0.6.4", reason = "existing transitive version split" },
  { crate = "rand_core@0.9.5", reason = "existing transitive version split" },
  { crate = "sha1@0.10.7", reason = "existing transitive version split" },
  { crate = "sha2@0.10.9", reason = "existing transitive version split" },
  { crate = "syn@2.0.119", reason = "existing transitive version split" },
  { crate = "thiserror@1.0.69", reason = "existing transitive version split" },
  { crate = "thiserror-impl@1.0.69", reason = "existing transitive version split" },
  { crate = "untrusted@0.7.1", reason = "existing transitive version split" },
  { crate = "wasi@0.11.1+wasi-snapshot-preview1", reason = "existing transitive version split" },
  { crate = "windows-sys@0.52.0", reason = "existing transitive version split" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = false
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
