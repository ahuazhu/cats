name: Verify production control-plane HA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inspect leader addresses or disrupt the elected leader"
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - disrupt
      confirmation:
        description: "Type the confirmation required by the selected mode"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-control-plane-ha-drill
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  drill:
    name: Diagnose or disrupt the elected reconciler
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Require the mode-specific confirmation
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$MODE:$CONFIRMATION" in
            diagnose:READ_ONLY_CONTROL_PLANE_LEADER_DIAGNOSTIC|disrupt:DELETE_ONE_CATS_CONTROLD_LEADER) ;;
            *)
              echo "::error::confirmation does not match mode $MODE"
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assume production deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --kubeconfig "$RUNNER_TEMP/kubeconfig"

      - name: Verify control-plane redundancy
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          kube=(kubectl --namespace cats)
          "${kube[@]}" rollout status deployment/cats-controld --timeout=5m

          deployment="$("${kube[@]}" get deployment cats-controld --output=json)"
          desired="$(jq -r '.spec.replicas' <<<"$deployment")"
          ready="$(jq -r '.status.readyReplicas // 0' <<<"$deployment")"
          available="$(jq -r '.status.availableReplicas // 0' <<<"$deployment")"
          if (( desired < 2 || ready != desired || available != desired )); then
            echo "::error::cats-controld is not fully redundant: desired=$desired ready=$ready available=$available"
            exit 1
          fi

          pods="$("${kube[@]}" get pods \
            --selector app.kubernetes.io/name=cats-controld \
            --output=json)"
          ready_pods="$(jq -r '
            .items[]
            | select(
                .metadata.deletionTimestamp == null
                and .status.phase == "Running"
                and any(.status.conditions[]?;
                  .type == "Ready" and .status == "True")
                and ((.status.containerStatuses // []) | length) > 0
                and all(.status.containerStatuses[]; .ready == true)
              )
            | [.metadata.name, .metadata.uid, .status.podIP, .spec.nodeName]
            | @tsv
          ' <<<"$pods")"
          ready_count="$(jq '
            [.items[] | select(
              .metadata.deletionTimestamp == null
              and .status.phase == "Running"
              and any(.status.conditions[]?;
                .type == "Ready" and .status == "True")
              and ((.status.containerStatuses // []) | length) > 0
              and all(.status.containerStatuses[]; .ready == true)
            )] | length
          ' <<<"$pods")"
          distinct_nodes="$(cut -f4 <<<"$ready_pods" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')"
          if (( ready_count < 2 || distinct_nodes < 2 )); then
            echo "::error::ready control-plane Pods are not spread across two nodes"
            printf '%s\n' "$ready_pods"
            exit 1
          fi

          if [[ "$MODE" == "disrupt" ]]; then
            disruptions_allowed="$("${kube[@]}" get poddisruptionbudget cats-controld \
              --output=jsonpath='{.status.disruptionsAllowed}')"
            if (( disruptions_allowed < 1 )); then
              echo "::error::the cats-controld PDB currently allows no disruption"
              exit 1
            fi
          fi

      - name: Report singleton lock and Pod addresses
        if: inputs.mode == 'diagnose'
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -euo pipefail
          kube=(kubectl --namespace cats)
          pods="$("${kube[@]}" get pods \
            --selector app.kubernetes.io/name=cats-controld \
            --output=json)"
          probe="control-ha-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          lock_query="SELECT json_build_object('schema',current_schema(),'expected_classid',hashtext(current_schema())::oid::text,'locks',COALESCE(json_agg(json_build_object('role_key',l.objid::text,'objsubid',l.objsubid,'classid',l.classid::text,'client_addr',a.client_addr::text,'application_name',a.application_name) ORDER BY l.objid) FILTER (WHERE l.pid IS NOT NULL),'[]'::json))::text FROM pg_locks AS l JOIN pg_stat_activity AS a ON a.pid=l.pid WHERE l.locktype='advisory' AND l.granted AND l.objid IN (420201,420202,420203)"
          lock_report="$(
            deploy/aws/run-postgres-probe.sh \
              "$KUBECONFIG" \
              cats \
              "$probe" \
              "$lock_query"
          )"
          echo "Singleton lock report:"
          jq . <<<"$lock_report"
          echo "Pod address report (name, pod IP, host IP, node, ready):"
          jq -r '
            .items[]
            | [
                .metadata.name,
                (.status.podIP // "<none>"),
                (.status.hostIP // "<none>"),
                (.spec.nodeName // "<none>"),
                (all(.status.containerStatuses[]?; .ready == true) | tostring)
              ]
            | @tsv
          ' <<<"$pods"

      - name: Delete the leader while probing the public API
        if: inputs.mode == 'disrupt'
        id: disrupt
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -euo pipefail
          kube=(kubectl --namespace cats)
          evidence="$RUNNER_TEMP/control-ha-evidence"
          mkdir -p "$evidence"
          evidence_pids=()
          watch_pids=()
          probe_pid=""

          stop_evidence_processes() {
            local pid cleanup_failed=0
            for pid in "${evidence_pids[@]}"; do
              if ! python3 deploy/aws/terminate-process-tree.py \
                --root-pid "$pid" \
                --timeout-seconds 2
              then
                cleanup_failed=1
              fi
            done
            for pid in "${evidence_pids[@]}"; do
              wait "$pid" 2>/dev/null || true
            done
            evidence_pids=()
            return "$cleanup_failed"
          }

          cleanup_evidence() {
            if [[ -n "$probe_pid" ]] && kill -0 "$probe_pid" 2>/dev/null; then
              # The probe owns its curl children. Signal its common finalizer
              # and let it reap those children before evidence is uploaded.
              kill "$probe_pid" 2>/dev/null || true
              for _ in {1..100}; do
                if ! kill -0 "$probe_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.05
              done
              if kill -0 "$probe_pid" 2>/dev/null; then
                echo "::error::public probe finalizer exceeded its five-second cleanup bound"
                python3 deploy/aws/terminate-process-tree.py \
                  --root-pid "$probe_pid" \
                  --timeout-seconds 1 \
                  || true
              fi
              wait "$probe_pid" 2>/dev/null || true
            fi
            stop_evidence_processes || true
          }
          trap cleanup_evidence EXIT

          # Resolve the lock owner immediately before the disruption. Keeping
          # selection and deletion in one step prevents a queued Actions step
          # from deleting a Pod after leadership has already moved elsewhere.
          pods="$("${kube[@]}" get pods \
            --selector app.kubernetes.io/name=cats-controld \
            --output=json)"
          pods_file="$evidence/pods-before.json"
          printf '%s\n' "$pods" > "$pods_file"
          owner_probe="control-ha-owner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          owner_query="SELECT COALESCE(host(a.client_addr), '<local>') FROM pg_locks AS l JOIN pg_stat_activity AS a ON a.pid=l.pid WHERE l.locktype='advisory' AND l.classid=hashtext(current_schema())::oid AND l.objid=420201 AND l.objsubid=2 AND l.granted"
          owner_addresses="$(
            deploy/aws/run-postgres-probe.sh \
              "$KUBECONFIG" \
              cats \
              "$owner_probe" \
              "$owner_query"
          )"
          selection="$(
            deploy/aws/select-reconciler-owner.sh "$pods_file" \
              <<<"$owner_addresses"
          )"
          target="$(jq -r '.name' <<<"$selection")"
          target_uid="$(jq -r '.uid' <<<"$selection")"
          owner_address_kind="$(jq -r '.address_kind' <<<"$selection")"
          echo "Reconciler leader before disruption: $target ($owner_address_kind source)"
          echo "target=$target" >> "$GITHUB_OUTPUT"

          # Calibrate every watch with an initial snapshot before deletion. An
          # unavailable EndpointSlice API or an empty Service selection is a
          # drill failure, not permission to proceed without routing evidence.
          "${kube[@]}" get endpointslices.discovery.k8s.io \
            --selector kubernetes.io/service-name=cats-controld \
            --output=json > "$evidence/endpointslices-before.json"
          jq -e '.items | length > 0' \
            "$evidence/endpointslices-before.json" >/dev/null
          "${kube[@]}" get service cats-controld \
            --output=json > "$evidence/service-before.json"
          "${kube[@]}" get ingress cats-public \
            --output=json > "$evidence/ingress-before.json"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg sha "$GITHUB_SHA" \
            --arg target "$target" \
            --arg target_uid "$target_uid" \
            --arg owner_address_kind "$owner_address_kind" \
            --arg started_at "$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" \
            '{run_id:$run_id,run_attempt:$run_attempt,sha:$sha,target:$target,target_uid:$target_uid,owner_address_kind:$owner_address_kind,started_at:$started_at}' \
            > "$evidence/metadata.json"

          watch_pods() {
            local output=$1
            "${kube[@]}" get pods \
              --selector app.kubernetes.io/name=cats-controld \
              --watch \
              --output-watch-events \
              --output=json \
              | jq --unbuffered -c '{
                  observed_epoch: now,
                  event_type: .type,
                  pod: {
                    name: .object.metadata.name,
                    uid: .object.metadata.uid,
                    resource_version: .object.metadata.resourceVersion,
                    deletion_timestamp: .object.metadata.deletionTimestamp,
                    node: .object.spec.nodeName,
                    phase: .object.status.phase,
                    pod_ip: .object.status.podIP,
                    host_ip: .object.status.hostIP,
                    conditions: [
                      .object.status.conditions[]?
                      | {type, status, reason, last_transition_time: .lastTransitionTime}
                    ],
                    containers: [
                      .object.status.containerStatuses[]?
                      | {
                          name,
                          ready,
                          restart_count: .restartCount,
                          state: (.state | keys)
                        }
                    ]
                  }
                }' \
              | python3 deploy/aws/retain-bounded-jsonl.py \
                  --output "$output" \
                  --max-lines 2000 \
                  --max-bytes 1048576
          }
          watch_endpoint_slices() {
            local output=$1
            "${kube[@]}" get endpointslices.discovery.k8s.io \
              --selector kubernetes.io/service-name=cats-controld \
              --watch \
              --output-watch-events \
              --output=json \
              | jq --unbuffered -c '{
                  observed_epoch: now,
                  event_type: .type,
                  endpoint_slice: {
                    name: .object.metadata.name,
                    uid: .object.metadata.uid,
                    resource_version: .object.metadata.resourceVersion,
                    deletion_timestamp: .object.metadata.deletionTimestamp,
                    address_type: .object.addressType,
                    endpoints: [
                      .object.endpoints[]?
                      | {
                          addresses,
                          conditions,
                          node_name: .nodeName,
                          zone,
                          target_ref: {
                            kind: .targetRef.kind,
                            name: .targetRef.name,
                            uid: .targetRef.uid
                          }
                        }
                    ]
                  }
                }' \
              | python3 deploy/aws/retain-bounded-jsonl.py \
                  --output "$output" \
                  --max-lines 2000 \
                  --max-bytes 1048576
          }
          stream_pod_log_summaries() {
            local pod=$1
            local output=$2
            "${kube[@]}" logs --follow "pod/$pod" \
              --container=controld \
              --timestamps \
              | python3 deploy/aws/summarize-control-plane-log.py \
              | python3 deploy/aws/retain-bounded-jsonl.py \
                  --output "$output" \
                  --max-lines 2000 \
                  --max-bytes 1048576
          }

          watch_pods "$evidence/pods-timeline.jsonl" &
          watch_pid=$!
          evidence_pids+=("$watch_pid")
          watch_pids+=("$watch_pid")
          watch_endpoint_slices "$evidence/endpointslices-timeline.jsonl" &
          watch_pid=$!
          evidence_pids+=("$watch_pid")
          watch_pids+=("$watch_pid")
          while IFS= read -r pod; do
            stream_pod_log_summaries \
              "$pod" \
              "$evidence/$pod-log-summary.jsonl" &
            evidence_pids+=("$!")
          done < <(jq -r '.items[].metadata.name' "$pods_file")

          # AWS exec credentials and the Kubernetes watch connection can take
          # several seconds to start. Cross the destructive boundary only after
          # both watches emit their actual initial ADDED events. The bounded
          # waiter also fails immediately if either producer exits early.
          deploy/aws/wait-for-evidence-streams.sh 30 \
            "${watch_pids[0]}" "$evidence/pods-timeline.jsonl" \
            "${watch_pids[1]}" "$evidence/endpointslices-timeline.jsonl"
          for pid in "${evidence_pids[@]}"; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::control-plane HA evidence stream exited before deletion"
              exit 1
            fi
          done

          # Re-resolve the backend at the last safe boundary. Natural
          # leadership movement while this queued job was preparing must not
          # turn the drill into deletion of a standby.
          confirm_pods_file="$evidence/pods-confirm.json"
          "${kube[@]}" get pods \
            --selector app.kubernetes.io/name=cats-controld \
            --output=json > "$confirm_pods_file"
          confirm_probe="control-ha-owner-confirm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          confirm_addresses="$(
            deploy/aws/run-postgres-probe.sh \
              "$KUBECONFIG" \
              cats \
              "$confirm_probe" \
              "$owner_query"
          )"
          confirm_selection="$(
            deploy/aws/select-reconciler-owner.sh "$confirm_pods_file" \
              <<<"$confirm_addresses"
          )"
          confirm_target="$(jq -r '.name' <<<"$confirm_selection")"
          confirm_uid="$(jq -r '.uid' <<<"$confirm_selection")"
          if [[ "$confirm_target" != "$target" || "$confirm_uid" != "$target_uid" ]]; then
            echo "::error::reconciler leadership changed before the disruption boundary"
            exit 1
          fi

          mkdir -p "$evidence/public-probes"
          python3 deploy/aws/probe-public-endpoint.py \
            --url https://cats.run/healthz \
            --output-dir "$evidence/public-probes" \
            --count 240 \
            --interval-ms 250 \
            --max-in-flight 16 \
            --connect-timeout-seconds 2 \
            --max-time-seconds 3 \
            --max-schedule-lag-ms 250 \
            > "$evidence/public-probes/runner.log" \
            2> "$evidence/public-probes/runner.stderr" &
          probe_pid=$!

          # The first scheduled request is the same probe as the disruption
          # oracle, not a weaker curl. The executable readiness gate requires
          # that completed result and its safe header evidence before crossing
          # the destructive boundary; later attempts keep their fixed schedule.
          python3 deploy/aws/wait-for-public-probe-baseline.py \
            --probe-pid "$probe_pid" \
            --output-dir "$evidence/public-probes" \
            --timeout-seconds 10

          observed_uid="$("${kube[@]}" get pod "$target" \
            --output=jsonpath='{.metadata.uid}')"
          if [[ "$observed_uid" != "$target_uid" ]]; then
            echo "::error::the selected leader changed before deletion"
            exit 1
          fi
          printf '%s\teviction-request-start\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" \
            >> "$evidence/markers.tsv"
          deploy/aws/evict-pod-with-uid.sh cats "$target" "$target_uid" \
            | tee "$evidence/eviction.log"
          printf '%s\teviction-accepted\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" \
            >> "$evidence/markers.tsv"
          "${kube[@]}" wait --for=delete "pod/$target" --timeout=5m \
            | tee "$evidence/pod-delete-wait.log"
          printf '%s\tpod-deleted\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" \
            >> "$evidence/markers.tsv"
          "${kube[@]}" rollout status deployment/cats-controld --timeout=10m \
            | tee "$evidence/rollout.log"
          printf '%s\trollout-complete\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" \
            >> "$evidence/markers.tsv"
          "${kube[@]}" get pods \
            --selector app.kubernetes.io/name=cats-controld \
            --output=json > "$evidence/pods-after-rollout.json"
          "${kube[@]}" get endpointslices.discovery.k8s.io \
            --selector kubernetes.io/service-name=cats-controld \
            --output=json > "$evidence/endpointslices-after-rollout.json"

          set +e
          wait "$probe_pid"
          probe_status=$?
          set -e
          probe_pid=""
          stop_evidence_processes
          trap - EXIT
          if (( probe_status != 0 )); then
            echo "::error::the public control-plane health endpoint failed during leader replacement"
            if [[ -s "$evidence/public-probes/results.jsonl" ]]; then
              jq -c 'select(.failure_reasons | length > 0)' \
                "$evidence/public-probes/results.jsonl" \
                | sed -n '1,40p'
            else
              sed -n '1,80p' "$evidence/public-probes/runner.stderr"
            fi
            exit 1
          fi
          echo "All 240 public health probes succeeded during leader replacement (fixed-rate, bounded concurrency)."

      - name: Verify replacement, node spread and reconciler takeover
        if: inputs.mode == 'disrupt'
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          OLD_TARGET: ${{ steps.disrupt.outputs.target }}
        run: |
          set -euo pipefail
          kube=(kubectl --namespace cats)
          deployment="$("${kube[@]}" get deployment cats-controld --output=json)"
          desired="$(jq -r '.spec.replicas' <<<"$deployment")"
          ready="$(jq -r '.status.readyReplicas // 0' <<<"$deployment")"
          available="$(jq -r '.status.availableReplicas // 0' <<<"$deployment")"
          if (( desired < 2 || ready != desired || available != desired )); then
            echo "::error::cats-controld did not return to full redundancy"
            exit 1
          fi

          pods="$("${kube[@]}" get pods \
            --selector app.kubernetes.io/name=cats-controld \
            --output=json)"
          evidence="$RUNNER_TEMP/control-ha-evidence"
          pods_file="$evidence/pods-final.json"
          printf '%s\n' "$pods" > "$pods_file"
          if jq -e --arg old "$OLD_TARGET" '
            any(.items[]; .metadata.name == $old)
          ' <<<"$pods" >/dev/null; then
            echo "::error::the deleted leader Pod still exists"
            exit 1
          fi
          distinct_nodes="$(jq -r '
            .items[]
            | select(
                .metadata.deletionTimestamp == null
                and .status.phase == "Running"
                and any(.status.conditions[]?;
                  .type == "Ready" and .status == "True")
                and ((.status.containerStatuses // []) | length) > 0
                and all(.status.containerStatuses[]; .ready == true)
              )
            | .spec.nodeName
          ' <<<"$pods" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')"
          if (( distinct_nodes < 2 )); then
            echo "::error::replacement control-plane Pods are not node-spread"
            exit 1
          fi

          probe="control-ha-owner-after-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          owner_query="SELECT COALESCE(host(a.client_addr), '<local>') FROM pg_locks AS l JOIN pg_stat_activity AS a ON a.pid=l.pid WHERE l.locktype='advisory' AND l.classid=hashtext(current_schema())::oid AND l.objid=420201 AND l.objsubid=2 AND l.granted"
          owner_addresses="$(
            deploy/aws/run-postgres-probe.sh \
              "$KUBECONFIG" \
              cats \
              "$probe" \
              "$owner_query"
          )"
          selection="$(
            deploy/aws/select-reconciler-owner.sh "$pods_file" \
              <<<"$owner_addresses"
          )"
          new_leader="$(jq -r '.name' <<<"$selection")"
          owner_address_kind="$(jq -r '.address_kind' <<<"$selection")"
          if [[ -z "$new_leader" || "$new_leader" == "$OLD_TARGET" ]]; then
            echo "::error::reconciler leadership did not move to a live replacement"
            exit 1
          fi
          echo "Reconciler leader after disruption: $new_leader ($owner_address_kind source)"
          printf '%s\t%s\n' "$new_leader" "$owner_address_kind" \
            > "$evidence/reconciler-owner-after.tsv"
          printf '%s\treconciler-takeover-verified\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" \
            >> "$evidence/markers.tsv"

      - name: Upload control-plane HA evidence
        if: always() && inputs.mode == 'disrupt'
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-ha-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-ha-evidence
          if-no-files-found: warn
          retention-days: 30
