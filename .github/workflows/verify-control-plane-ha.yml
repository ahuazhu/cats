name: Verify production control-plane HA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inspect leader addresses or disrupt the elected leader"
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - disrupt
      confirmation:
        description: "Type the confirmation required by the selected mode"
        required: true
        type: string
      coordination_mode:
        description: "Optional issue-124 lifecycle lock mode; leave disabled for the ordinary HA drill"
        required: false
        default: "disabled"
        type: string
      coordination_issue:
        description: "Must be 124 when lifecycle coordination is enabled"
        required: false
        default: ""
        type: string
      coordination_token:
        description: "Unique non-secret q124 handoff token"
        required: false
        default: ""
        type: string
      coordination_workspace_id:
        description: "Exact qualification workspace ID"
        required: false
        default: ""
        type: string
      coordination_cat_id:
        description: "Exact qualification Cat ID"
        required: false
        default: ""
        type: string
      coordination_cat_name:
        description: "Exact q124 qualification Cat name"
        required: false
        default: ""
        type: string
      coordination_generation:
        description: "Exact lifecycle resource generation"
        required: false
        default: ""
        type: string
      coordination_operation_kind:
        description: "Exact lifecycle Operation kind"
        required: false
        default: ""
        type: string
      coordination_desired_state:
        description: "Expected desired state at the handoff"
        required: false
        default: ""
        type: string
      coordination_transitional_state:
        description: "Expected persisted transitional state"
        required: false
        default: ""
        type: string
      coordination_final_state:
        description: "Expected final state after takeover"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: production-control-plane-ha-drill
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  drill:
    name: Diagnose or disrupt the elected reconciler
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require the mode-specific confirmation
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          COORDINATION_MODE: ${{ inputs.coordination_mode }}
          COORDINATION_ISSUE: ${{ inputs.coordination_issue }}
          COORDINATION_TOKEN: ${{ inputs.coordination_token }}
          COORDINATION_WORKSPACE_ID: ${{ inputs.coordination_workspace_id }}
          COORDINATION_CAT_ID: ${{ inputs.coordination_cat_id }}
          COORDINATION_CAT_NAME: ${{ inputs.coordination_cat_name }}
          COORDINATION_GENERATION: ${{ inputs.coordination_generation }}
          COORDINATION_OPERATION_KIND: ${{ inputs.coordination_operation_kind }}
          COORDINATION_DESIRED_STATE: ${{ inputs.coordination_desired_state }}
          COORDINATION_TRANSITIONAL_STATE: ${{ inputs.coordination_transitional_state }}
          COORDINATION_FINAL_STATE: ${{ inputs.coordination_final_state }}
        run: |
          set -euo pipefail
          case "$MODE:$CONFIRMATION" in
            diagnose:READ_ONLY_CONTROL_PLANE_LEADER_DIAGNOSTIC|disrupt:DELETE_ONE_CATS_CONTROLD_LEADER) ;;
            *)
              echo "::error::confirmation does not match mode $MODE"
              exit 1
              ;;
          esac
          if [[ "$COORDINATION_MODE" == "disabled" ]]; then
            if [[ -n "$COORDINATION_ISSUE$COORDINATION_TOKEN$COORDINATION_WORKSPACE_ID$COORDINATION_CAT_ID$COORDINATION_CAT_NAME$COORDINATION_GENERATION$COORDINATION_OPERATION_KIND$COORDINATION_DESIRED_STATE$COORDINATION_TRANSITIONAL_STATE$COORDINATION_FINAL_STATE" ]]; then
              echo "::error::lifecycle coordination fields must be empty when coordination_mode=disabled"
              exit 1
            fi
            exit 0
          fi
          if [[ "$MODE" != "disrupt" ]]; then
            echo "::error::lifecycle coordination is available only in disrupt mode"
            exit 1
          fi
          if [[ "$COORDINATION_MODE" != "LOCK_Q124_LIFECYCLE" ]]; then
            echo "::error::coordination_mode must be disabled or LOCK_Q124_LIFECYCLE"
            exit 1
          fi
          [[ "$COORDINATION_ISSUE" == "124" ]] || {
            echo "::error::lifecycle coordination is restricted to issue 124"
            exit 1
          }
          [[ "$COORDINATION_WORKSPACE_ID" == "ws_788c5bfc3931" ]] || {
            echo "::error::lifecycle coordination is restricted to the qualification workspace"
            exit 1
          }
          [[ "$COORDINATION_TOKEN" =~ ^q124-[a-z0-9-]{8,75}$ ]]
          [[ "$COORDINATION_CAT_ID" =~ ^cat_[a-f0-9]{12}$ ]]
          [[ "$COORDINATION_CAT_NAME" =~ ^q124-ha-[a-z0-9-]+$ ]]
          [[ "$COORDINATION_GENERATION" =~ ^[1-9][0-9]*$ ]]
          case "$COORDINATION_OPERATION_KIND:$COORDINATION_DESIRED_STATE:$COORDINATION_TRANSITIONAL_STATE:$COORDINATION_FINAL_STATE" in
            cat.start:running:starting:running|cat.resume:running:starting:running|cat.suspend:suspended:suspending:suspended|cat.warm:warm:warming:warm|cat.stop:cold:stopping:cold) ;;
            *)
              echo "::error::invalid lifecycle coordination transition tuple"
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assume production deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --kubeconfig "$RUNNER_TEMP/kubeconfig"

      - name: Verify control-plane redundancy
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          kube=(kubectl --namespace cats)
          "${kube[@]}" rollout status deployment/cats-controld --timeout=5m

          deployment="$("${kube[@]}" get deployment cats-controld --output=json)"
          desired="$(jq -r '.spec.replicas' <<<"$deployment")"
          ready="$(jq -r '.status.readyReplicas // 0' <<<"$deployment")"
          available="$(jq -r '.status.availableReplicas // 0' <<<"$deployment")"
          if (( desired < 2 || ready != desired || available != desired )); then
            echo "::error::cats-controld is not fully redundant: desired=$desired ready=$ready available=$available"
            exit 1
          fi

          pods="$("${kube[@]}" get pods \
            --selector app.kubernetes.io/name=cats-controld \
            --output=json)"
          ready_pods="$(jq -r '
            .items[]
            | select(
                .metadata.deletionTimestamp == null
                and .status.phase == "Running"
                and any(.status.conditions[]?;
                  .type == "Ready" and .status == "True")
                and ((.status.containerStatuses // []) | length) > 0
                and all(.status.containerStatuses[]; .ready == true)
              )
            | [.metadata.name, .metadata.uid, .status.podIP, .spec.nodeName]
            | @tsv
          ' <<<"$pods")"
          ready_count="$(jq '
            [.items[] | select(
              .metadata.deletionTimestamp == null
              and .status.phase == "Running"
              and any(.status.conditions[]?;
                .type == "Ready" and .status == "True")
              and ((.status.containerStatuses // []) | length) > 0
              and all(.status.containerStatuses[]; .ready == true)
            )] | length
          ' <<<"$pods")"
          distinct_nodes="$(cut -f4 <<<"$ready_pods" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')"
          if (( ready_count < 2 || distinct_nodes < 2 )); then
            echo "::error::ready control-plane Pods are not spread across two nodes"
            printf '%s\n' "$ready_pods"
            exit 1
          fi

          if [[ "$MODE" == "disrupt" ]]; then
            disruptions_allowed="$("${kube[@]}" get poddisruptionbudget cats-controld \
              --output=jsonpath='{.status.disruptionsAllowed}')"
            if (( disruptions_allowed < 1 )); then
              echo "::error::the cats-controld PDB currently allows no disruption"
              exit 1
            fi
          fi

      - name: Report singleton lock and Pod addresses
        if: inputs.mode == 'diagnose'
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -euo pipefail
          kube=(kubectl --namespace cats)
          pods="$("${kube[@]}" get pods \
            --selector app.kubernetes.io/name=cats-controld \
            --output=json)"
          probe="control-ha-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          lock_query="SELECT json_build_object('schema',current_schema(),'expected_classid',hashtext(current_schema())::oid::text,'locks',COALESCE(json_agg(json_build_object('role_key',l.objid::text,'objsubid',l.objsubid,'classid',l.classid::text,'client_addr',a.client_addr::text,'application_name',a.application_name) ORDER BY l.objid) FILTER (WHERE l.pid IS NOT NULL),'[]'::json))::text FROM pg_locks AS l JOIN pg_stat_activity AS a ON a.pid=l.pid WHERE l.locktype='advisory' AND l.granted AND l.objid IN (420201,420202,420203)"
          lock_report="$(
            deploy/aws/run-postgres-probe.sh \
              "$KUBECONFIG" \
              cats \
              "$probe" \
              "$lock_query"
          )"
          echo "Singleton lock report:"
          jq . <<<"$lock_report"
          echo "Pod address report (name, pod IP, host IP, node, ready):"
          jq -r '
            .items[]
            | [
                .metadata.name,
                (.status.podIP // "<none>"),
                (.status.hostIP // "<none>"),
                (.spec.nodeName // "<none>"),
                (all(.status.containerStatuses[]?; .ready == true) | tostring)
              ]
            | @tsv
          ' <<<"$pods"

      - name: Delete the leader while probing the public API
        if: inputs.mode == 'disrupt'
        id: disrupt
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          GH_TOKEN: ${{ github.token }}
          COORDINATION_MODE: ${{ inputs.coordination_mode }}
          COORDINATION_ISSUE: ${{ inputs.coordination_issue }}
          COORDINATION_TOKEN: ${{ inputs.coordination_token }}
          COORDINATION_WORKSPACE_ID: ${{ inputs.coordination_workspace_id }}
          COORDINATION_CAT_ID: ${{ inputs.coordination_cat_id }}
          COORDINATION_CAT_NAME: ${{ inputs.coordination_cat_name }}
          COORDINATION_GENERATION: ${{ inputs.coordination_generation }}
          COORDINATION_OPERATION_KIND: ${{ inputs.coordination_operation_kind }}
          COORDINATION_DESIRED_STATE: ${{ inputs.coordination_desired_state }}
          COORDINATION_TRANSITIONAL_STATE: ${{ inputs.coordination_transitional_state }}
          COORDINATION_FINAL_STATE: ${{ inputs.coordination_final_state }}
        run: |
          set -euo pipefail
          kube=(kubectl --namespace cats)
          failures="$RUNNER_TEMP/control-ha-probe-failures"
          : > "$failures"
          probe_pid=""
          coordinator=""
          coordinator_uid=""
          locked_operation=""
          locked_at=""
          deletion_at=""

          cleanup_probe() {
            if [[ -n "$probe_pid" ]] && kill -0 "$probe_pid" 2>/dev/null; then
              kill "$probe_pid" 2>/dev/null || true
            fi
            if [[ -n "$probe_pid" ]]; then
              wait "$probe_pid" 2>/dev/null || true
              probe_pid=""
            fi
          }

          cleanup_coordinator() {
            [[ -n "$coordinator" ]] || return 0
            set +e
            observed_uid="$("${kube[@]}" get pod "$coordinator" --output=jsonpath='{.metadata.uid}' 2>&1)"
            get_status=$?
            set -e
            if (( get_status != 0 )); then
              if [[ "$observed_uid" == *"NotFound"* || "$observed_uid" == *"not found"* ]]; then
                coordinator=""
                return 0
              fi
              printf '%s\n' "$observed_uid" >&2
              return "$get_status"
            fi
            if [[ -z "$coordinator_uid" || "$observed_uid" != "$coordinator_uid" ]]; then
              echo "::error::refusing to delete lifecycle coordinator with an unverified UID"
              return 1
            fi
            "${kube[@]}" delete pod "$coordinator" --wait=true --timeout=2m >/dev/null
            coordinator=""
          }

          cleanup() {
            rc=$?
            trap - EXIT
            set +e
            cleanup_probe
            cleanup_coordinator
            cleanup_status=$?
            set -e
            if (( rc == 0 && cleanup_status != 0 )); then
              rc=$cleanup_status
            fi
            exit "$rc"
          }
          trap cleanup EXIT

          # Resolve the lock owner immediately before the disruption. Keeping
          # selection and deletion in one step prevents a queued Actions step
          # from deleting a Pod after leadership has already moved elsewhere.
          pods="$("${kube[@]}" get pods \
            --selector app.kubernetes.io/name=cats-controld \
            --output=json)"
          pods_file="$RUNNER_TEMP/control-ha-pods-before.json"
          printf '%s\n' "$pods" > "$pods_file"
          owner_probe="control-ha-owner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          owner_query="SELECT COALESCE(host(a.client_addr), '<local>') FROM pg_locks AS l JOIN pg_stat_activity AS a ON a.pid=l.pid WHERE l.locktype='advisory' AND l.classid=hashtext(current_schema())::oid AND l.objid=420201 AND l.objsubid=2 AND l.granted"
          owner_addresses="$(
            deploy/aws/run-postgres-probe.sh \
              "$KUBECONFIG" \
              cats \
              "$owner_probe" \
              "$owner_query"
          )"
          selection="$(
            deploy/aws/select-reconciler-owner.sh "$pods_file" \
              <<<"$owner_addresses"
          )"
          target="$(jq -r '.name' <<<"$selection")"
          target_uid="$(jq -r '.uid' <<<"$selection")"
          owner_address_kind="$(jq -r '.address_kind' <<<"$selection")"
          echo "Reconciler leader before disruption: $target ($owner_address_kind source)"
          echo "target=$target" >> "$GITHUB_OUTPUT"

          if [[ "$COORDINATION_MODE" == "LOCK_Q124_LIFECYCLE" ]]; then
            coordinator="control-ha-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            if existing="$("${kube[@]}" get pod "$coordinator" --output=name 2>&1)"; then
              echo "::error::refusing to reuse existing lifecycle coordinator $existing"
              exit 1
            elif [[ "$existing" != *"NotFound"* && "$existing" != *"not found"* ]]; then
              printf '%s\n' "$existing"
              exit 1
            fi

            # The coordinator starts polling before READY is published. Once it
            # sees exactly one matching active Operation and the persisted Cat
            # transition, SELECT ... FOR UPDATE holds the Cat row for a bounded
            # 90 seconds. The old reconciler can finish physical node work, but
            # cannot settle the lifecycle marker before its Pod is deleted.
            coordinator_command="$(cat <<'COORDINATOR'
            case "$CATS_HA_TOKEN" in q124-*) ;; *) exit 64 ;; esac
            case "$CATS_HA_CAT_ID" in cat_*) ;; *) exit 64 ;; esac
            deadline=$(( $(date +%s) + 60 ))
            locked=false
            while (( $(date +%s) < deadline )); do
              sql="$(cat <<SQL
            DO \$cats_ha\$
            DECLARE locked_operation TEXT;
            BEGIN
              SELECT o.id INTO STRICT locked_operation
                FROM cats AS c
                JOIN operations AS o
                  ON o.resource_id = c.id
                 AND o.resource_generation = c.generation
               WHERE c.workspace_id = '${CATS_HA_WORKSPACE_ID}'
                 AND c.id = '${CATS_HA_CAT_ID}'
                 AND c.name = '${CATS_HA_CAT_NAME}'
                 AND c.generation = ${CATS_HA_GENERATION}
                 AND c.desired_state = '${CATS_HA_DESIRED_STATE}'
                 AND c.observed_state = '${CATS_HA_TRANSITIONAL_STATE}'
                 AND o.kind = '${CATS_HA_OPERATION_KIND}'
                 AND o.phase IN ('pending', 'running')
                 FOR UPDATE OF c;
              RAISE NOTICE 'CATS_HA_LIFECYCLE_LOCKED token=${CATS_HA_TOKEN} cat=${CATS_HA_CAT_ID} generation=${CATS_HA_GENERATION} operation=% locked_at=%',
                locked_operation,
                to_char(clock_timestamp() AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.MS"Z"');
              PERFORM pg_sleep(90);
            END
            \$cats_ha\$;
          SQL
            )"
              if psql "$CATS_POSTGRES_URL" -v ON_ERROR_STOP=1 -q -c "$sql"; then
                locked=true
                break
              fi
              sleep 0.2
            done
            if [[ "$locked" != true ]]; then
              echo "CATS_HA_LIFECYCLE_LOCK_TIMEOUT token=$CATS_HA_TOKEN" >&2
              exit 124
            fi
            locked_operation="$(psql "$CATS_POSTGRES_URL" -v ON_ERROR_STOP=1 -tA -c "
              SELECT o.id
                FROM cats AS c
                JOIN operations AS o
                  ON o.resource_id = c.id
                 AND o.resource_generation = c.generation
               WHERE c.workspace_id = '${CATS_HA_WORKSPACE_ID}'
                 AND c.id = '${CATS_HA_CAT_ID}'
                 AND c.name = '${CATS_HA_CAT_NAME}'
                 AND c.generation = ${CATS_HA_GENERATION}
                 AND o.kind = '${CATS_HA_OPERATION_KIND}'")"
            case "$locked_operation" in op_*) ;; *) exit 1 ;; esac
            released_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            echo "CATS_HA_LIFECYCLE_LOCK_RELEASED token=$CATS_HA_TOKEN operation=$locked_operation released_at=$released_at"
            converge_deadline=$(( $(date +%s) + 120 ))
            while (( $(date +%s) < converge_deadline )); do
              converged="$(psql "$CATS_POSTGRES_URL" -v ON_ERROR_STOP=1 -tA -c "
                SELECT o.id
                  FROM cats AS c
                  JOIN operations AS o
                    ON o.resource_id = c.id
                   AND o.resource_generation = c.generation
                 WHERE c.workspace_id = '${CATS_HA_WORKSPACE_ID}'
                   AND c.id = '${CATS_HA_CAT_ID}'
                   AND c.name = '${CATS_HA_CAT_NAME}'
                   AND c.generation = ${CATS_HA_GENERATION}
                   AND c.desired_state = '${CATS_HA_FINAL_STATE}'
                   AND c.observed_state = '${CATS_HA_FINAL_STATE}'
                   AND o.id = '${locked_operation}'
                   AND o.kind = '${CATS_HA_OPERATION_KIND}'
                   AND o.phase = 'succeeded'")"
              if [[ "$converged" == "$locked_operation" ]]; then
                echo "CATS_HA_EXACT_OPERATION_CONVERGED token=$CATS_HA_TOKEN operation=$locked_operation generation=$CATS_HA_GENERATION final_state=$CATS_HA_FINAL_STATE"
                exit 0
              fi
              sleep 0.25
            done
            echo "CATS_HA_EXACT_OPERATION_CONVERGENCE_TIMEOUT token=$CATS_HA_TOKEN operation=$locked_operation" >&2
            exit 124
          COORDINATOR
            )"
            overrides="$(
              jq -cn \
                --arg command "$coordinator_command" \
                --arg token "$COORDINATION_TOKEN" \
                --arg workspace "$COORDINATION_WORKSPACE_ID" \
                --arg cat_id "$COORDINATION_CAT_ID" \
                --arg cat_name "$COORDINATION_CAT_NAME" \
                --arg generation "$COORDINATION_GENERATION" \
                --arg operation_kind "$COORDINATION_OPERATION_KIND" \
                --arg desired "$COORDINATION_DESIRED_STATE" \
                --arg transitional "$COORDINATION_TRANSITIONAL_STATE" \
                --arg final "$COORDINATION_FINAL_STATE" '
                {
                  spec: {
                    activeDeadlineSeconds: 300,
                    terminationGracePeriodSeconds: 5,
                    restartPolicy: "Never",
                    containers: [{
                      name: "psql",
                      image: "postgres:16",
                      command: ["sh", "-ceu", $command],
                      env: [
                        {name:"CATS_HA_TOKEN",value:$token},
                        {name:"CATS_HA_WORKSPACE_ID",value:$workspace},
                        {name:"CATS_HA_CAT_ID",value:$cat_id},
                        {name:"CATS_HA_CAT_NAME",value:$cat_name},
                        {name:"CATS_HA_GENERATION",value:$generation},
                        {name:"CATS_HA_OPERATION_KIND",value:$operation_kind},
                        {name:"CATS_HA_DESIRED_STATE",value:$desired},
                        {name:"CATS_HA_TRANSITIONAL_STATE",value:$transitional},
                        {name:"CATS_HA_FINAL_STATE",value:$final}
                      ],
                      envFrom: [{secretRef:{name:"cats-runtime"}}]
                    }]
                  }
                }
              '
            )"
            "${kube[@]}" run "$coordinator" \
              --restart=Never \
              --image=postgres:16 \
              --overrides="$overrides" >/dev/null
            coordinator_uid="$("${kube[@]}" get pod "$coordinator" --output=jsonpath='{.metadata.uid}')"
            [[ -n "$coordinator_uid" ]]
            "${kube[@]}" wait --for=condition=Ready "pod/$coordinator" --timeout=2m >/dev/null
            ready_body="CATS_HA_COORD_READY token=$COORDINATION_TOKEN run_id=$GITHUB_RUN_ID cat=$COORDINATION_CAT_ID generation=$COORDINATION_GENERATION"
            gh api "repos/$GITHUB_REPOSITORY/issues/$COORDINATION_ISSUE/comments" \
              --method POST \
              --field body="$ready_body" >/dev/null
            echo "$ready_body"

            lock_deadline=$((SECONDS + 150))
            while :; do
              coordinator_logs="$("${kube[@]}" logs "$coordinator" --container=psql 2>&1 || true)"
              locked_line="$(awk -v token="$COORDINATION_TOKEN" '
                index($0,"CATS_HA_LIFECYCLE_LOCKED token=" token " ") {line=$0; count++}
                END {if (count == 1) print line}
              ' <<<"$coordinator_logs")"
              if [[ -n "$locked_line" ]]; then
                break
              fi
              phase="$("${kube[@]}" get pod "$coordinator" --output=jsonpath='{.status.phase}')"
              if [[ "$phase" == "Failed" || "$phase" == "Succeeded" || SECONDS -ge lock_deadline ]]; then
                printf '%s\n' "$coordinator_logs"
                echo "::error::lifecycle coordinator failed before acquiring the exact transition lock"
                exit 1
              fi
              sleep 0.25
            done
            locked_operation="$(sed -nE 's/.* operation=(op_[a-f0-9]+) locked_at=.*/\1/p' <<<"$locked_line")"
            locked_at="$(sed -nE 's/.* locked_at=([^ ]+).*/\1/p' <<<"$locked_line")"
            [[ "$locked_operation" =~ ^op_[a-f0-9]{12}$ && -n "$locked_at" ]]
            echo "Lifecycle coordinator locked token=$COORDINATION_TOKEN operation=$locked_operation locked_at=$locked_at"
          fi

          # Re-resolve the backend only after the optional lifecycle lock is
          # held. Natural leadership movement while coordination was waiting
          # must not turn the drill into eviction of a standby.
          confirm_pods_file="$RUNNER_TEMP/control-ha-pods-confirm.json"
          "${kube[@]}" get pods \
            --selector app.kubernetes.io/name=cats-controld \
            --output=json > "$confirm_pods_file"
          confirm_probe="control-ha-owner-confirm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          confirm_addresses="$(
            deploy/aws/run-postgres-probe.sh \
              "$KUBECONFIG" \
              cats \
              "$confirm_probe" \
              "$owner_query"
          )"
          confirm_selection="$(
            deploy/aws/select-reconciler-owner.sh "$confirm_pods_file" \
              <<<"$confirm_addresses"
          )"
          confirm_target="$(jq -r '.name' <<<"$confirm_selection")"
          confirm_uid="$(jq -r '.uid' <<<"$confirm_selection")"
          if [[ "$confirm_target" != "$target" || "$confirm_uid" != "$target_uid" ]]; then
            echo "::error::reconciler leadership changed before the disruption boundary"
            exit 1
          fi

          probe_public_api() {
            for attempt in $(seq 1 240); do
              if ! curl \
                --fail --silent --show-error \
                --connect-timeout 2 --max-time 3 \
                https://cats.run/healthz >/dev/null
              then
                echo "attempt=$attempt time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  >> "$failures"
              fi
              sleep 0.25
            done
          }

          probe_public_api &
          probe_pid=$!

          observed_uid="$("${kube[@]}" get pod "$target" \
            --output=jsonpath='{.metadata.uid}')"
          if [[ "$observed_uid" != "$target_uid" ]]; then
            echo "::error::the selected leader changed before deletion"
            exit 1
          fi
          if [[ "$COORDINATION_MODE" == "LOCK_Q124_LIFECYCLE" ]]; then
            observed_coordinator_uid="$("${kube[@]}" get pod "$coordinator" \
              --output=jsonpath='{.metadata.uid}')"
            coordinator_phase="$("${kube[@]}" get pod "$coordinator" \
              --output=jsonpath='{.status.phase}')"
            if [[ "$observed_coordinator_uid" != "$coordinator_uid" || "$coordinator_phase" != "Running" ]]; then
              echo "::error::lifecycle coordinator lost its exact UID or lock-holding process before deletion"
              exit 1
            fi
            deletion_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            echo "Deleting lifecycle-locked leader: $target uid=$target_uid operation=$locked_operation deletion_at=$deletion_at"
          fi
          deploy/aws/evict-pod-with-uid.sh cats "$target" "$target_uid"
          "${kube[@]}" wait --for=delete "pod/$target" --timeout=5m
          "${kube[@]}" rollout status deployment/cats-controld --timeout=10m

          wait "$probe_pid"
          probe_pid=""
          if [[ -s "$failures" ]]; then
            echo "::error::the public control-plane health endpoint failed during leader replacement"
            sed -n '1,40p' "$failures"
            exit 1
          fi
          echo "All 240 public health probes succeeded during leader replacement."

          if [[ "$COORDINATION_MODE" == "LOCK_Q124_LIFECYCLE" ]]; then
            converge_deadline=$((SECONDS + 150))
            while :; do
              coordinator_phase="$("${kube[@]}" get pod "$coordinator" \
                --output=jsonpath='{.status.phase}')"
              case "$coordinator_phase" in
                Succeeded) break ;;
                Failed)
                  "${kube[@]}" logs "$coordinator" --container=psql
                  echo "::error::lifecycle coordinator failed before exact Operation convergence"
                  exit 1
                  ;;
              esac
              if (( SECONDS >= converge_deadline )); then
                echo "::error::lifecycle coordinator did not finish within its bounded convergence wait"
                exit 1
              fi
              sleep 1
            done
            coordinator_logs="$("${kube[@]}" logs "$coordinator" --container=psql 2>&1)"
            release_line="$(awk -v token="$COORDINATION_TOKEN" '
              index($0,"CATS_HA_LIFECYCLE_LOCK_RELEASED token=" token " ") {line=$0; count++}
              END {if (count == 1) print line}
            ' <<<"$coordinator_logs")"
            converged_line="$(awk -v token="$COORDINATION_TOKEN" '
              index($0,"CATS_HA_EXACT_OPERATION_CONVERGED token=" token " ") {line=$0; count++}
              END {if (count == 1) print line}
            ' <<<"$coordinator_logs")"
            released_at="$(sed -nE 's/.* released_at=([^ ]+).*/\1/p' <<<"$release_line")"
            released_operation="$(sed -nE 's/.* operation=(op_[a-f0-9]+) .*/\1/p' <<<"$release_line")"
            converged_operation="$(sed -nE 's/.* operation=(op_[a-f0-9]+) .*/\1/p' <<<"$converged_line")"
            if [[ -z "$released_at" || "$released_operation" != "$locked_operation" || "$converged_operation" != "$locked_operation" ]]; then
              printf '%s\n' "$coordinator_logs"
              echo "::error::lifecycle coordinator did not prove one exact locked and converged Operation"
              exit 1
            fi
            locked_epoch="$(date --date="$locked_at" +%s%3N)"
            deletion_epoch="$(date --date="$deletion_at" +%s%3N)"
            released_epoch="$(date --date="$released_at" +%s%3N)"
            if (( locked_epoch > deletion_epoch || deletion_epoch > released_epoch )); then
              echo "::error::leader deletion was not enclosed by the lifecycle row-lock interval"
              exit 1
            fi
            echo "Lifecycle coordinator released token=$COORDINATION_TOKEN operation=$locked_operation released_at=$released_at"
            echo "Lifecycle exact operation converged token=$COORDINATION_TOKEN operation=$locked_operation generation=$COORDINATION_GENERATION final_state=$COORDINATION_FINAL_STATE"
            cleanup_coordinator
          fi

      - name: Verify replacement, node spread and reconciler takeover
        if: inputs.mode == 'disrupt'
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          OLD_TARGET: ${{ steps.disrupt.outputs.target }}
        run: |
          set -euo pipefail
          kube=(kubectl --namespace cats)
          deployment="$("${kube[@]}" get deployment cats-controld --output=json)"
          desired="$(jq -r '.spec.replicas' <<<"$deployment")"
          ready="$(jq -r '.status.readyReplicas // 0' <<<"$deployment")"
          available="$(jq -r '.status.availableReplicas // 0' <<<"$deployment")"
          if (( desired < 2 || ready != desired || available != desired )); then
            echo "::error::cats-controld did not return to full redundancy"
            exit 1
          fi

          pods="$("${kube[@]}" get pods \
            --selector app.kubernetes.io/name=cats-controld \
            --output=json)"
          pods_file="$RUNNER_TEMP/control-ha-pods-after.json"
          printf '%s\n' "$pods" > "$pods_file"
          if jq -e --arg old "$OLD_TARGET" '
            any(.items[]; .metadata.name == $old)
          ' <<<"$pods" >/dev/null; then
            echo "::error::the deleted leader Pod still exists"
            exit 1
          fi
          distinct_nodes="$(jq -r '
            .items[]
            | select(
                .metadata.deletionTimestamp == null
                and .status.phase == "Running"
                and any(.status.conditions[]?;
                  .type == "Ready" and .status == "True")
                and ((.status.containerStatuses // []) | length) > 0
                and all(.status.containerStatuses[]; .ready == true)
              )
            | .spec.nodeName
          ' <<<"$pods" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')"
          if (( distinct_nodes < 2 )); then
            echo "::error::replacement control-plane Pods are not node-spread"
            exit 1
          fi

          probe="control-ha-owner-after-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          owner_query="SELECT COALESCE(host(a.client_addr), '<local>') FROM pg_locks AS l JOIN pg_stat_activity AS a ON a.pid=l.pid WHERE l.locktype='advisory' AND l.classid=hashtext(current_schema())::oid AND l.objid=420201 AND l.objsubid=2 AND l.granted"
          owner_addresses="$(
            deploy/aws/run-postgres-probe.sh \
              "$KUBECONFIG" \
              cats \
              "$probe" \
              "$owner_query"
          )"
          selection="$(
            deploy/aws/select-reconciler-owner.sh "$pods_file" \
              <<<"$owner_addresses"
          )"
          new_leader="$(jq -r '.name' <<<"$selection")"
          owner_address_kind="$(jq -r '.address_kind' <<<"$selection")"
          if [[ -z "$new_leader" || "$new_leader" == "$OLD_TARGET" ]]; then
            echo "::error::reconciler leadership did not move to a live replacement"
            exit 1
          fi
          echo "Reconciler leader after disruption: $new_leader ($owner_address_kind source)"
