name: Deploy production

# Production deployment is an explicit operator action accepted only from main.
# The AWS role's OIDC subject is also pinned to refs/heads/main.
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EXPECTED_AWS_ACCOUNT_ID: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
  EXPECTED_AWS_PARTITION: ${{ vars.EXPECTED_AWS_PARTITION }}
  EXPECTED_AWS_REGION: ${{ vars.EXPECTED_AWS_REGION }}
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: Build image and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_SHA: ${{ github.sha }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_APPLICATION_KEY: ${{ vars.TF_STATE_APPLICATION_KEY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      PRODUCTION_TFVARS_B64: ${{ vars.PRODUCTION_TFVARS_B64 }}
      # The platform stack's database_master_user_secret_arn output. Not a
      # secret -- it is an ARN -- but it is the authority this deployment reads
      # the database password from, so a missing value fails the run.
      RDS_MASTER_USER_SECRET_ARN: ${{ vars.RDS_MASTER_USER_SECRET_ARN }}
      # Optional staged cutover. Empty preserves the direct-RDS storage DSN and
      # client-side session setup; setting it changes only the storage host.
      RDS_PROXY_ENDPOINT: ${{ vars.RDS_PROXY_ENDPOINT }}
      # Platform stack output; non-secret, but mandatory so controld cannot
      # silently point at a different object namespace than blockd.
      CHUNKSTORE_BUCKET_NAME: ${{ vars.CHUNKSTORE_BUCKET_NAME }}
      CHUNKSTORE_PREFIX: ${{ vars.CHUNKSTORE_PREFIX }}
      CONTROL_POSTGRES_SCHEMA: ${{ vars.CONTROL_POSTGRES_SCHEMA }}
      # Opaque names only. The Secrets are created by the root-only Route v2
      # credential workflow and must be immutable with closed key sets.
      ROUTE_V2_CONTROL_ARTIFACT_SECRET_NAME: ${{ vars.ROUTE_V2_CONTROL_ARTIFACT_SECRET_NAME }}
      ROUTE_V2_GATEWAY_ARTIFACT_SECRET_NAME: ${{ vars.ROUTE_V2_GATEWAY_ARTIFACT_SECRET_NAME }}
      # Canonical A23 public trust bundle emitted by the central provisioner.
      # Base64 preserves its exact JSON bytes through GitHub configuration.
      RUNTIME_PROVISIONER_TRUST_BUNDLE_B64: ${{ secrets.RUNTIME_PROVISIONER_TRUST_BUNDLE_B64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Require reviewed AWS target
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION EXPECTED_AWS_ACCOUNT_ID EXPECTED_AWS_PARTITION EXPECTED_AWS_REGION; do
            test -n "${!name:-}" || {
              echo "::error::Missing required repository variable $name"
              exit 1
            }
          done

      - name: Assume production deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify production AWS target
        run: |
          python3 deploy/aws/verify-aws-target.py \
            --expected-account-id "$EXPECTED_AWS_ACCOUNT_ID" \
            --expected-partition "$EXPECTED_AWS_PARTITION" \
            --expected-region "$EXPECTED_AWS_REGION"

      - name: Build the one Guest payload
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -qy busybox-static cpio zstd gzip e2fsprogs debootstrap musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release -p cats-guest-agent --target x86_64-unknown-linux-musl
          sudo env \
            HOME=/root \
            GUEST_AGENT_BIN="$PWD/target/x86_64-unknown-linux-musl/release/cats-guest-agent" \
            OUT="$RUNNER_TEMP/guest-build" \
            RELEASE_OUT="$PWD/guest-runtime-release.v1" \
            deploy/metal/build-guest-image.sh
          sudo chown -R "$USER:$USER" guest-runtime-release.v1
          find guest-runtime-release.v1 -type f -exec sha256sum {} + | LC_ALL=C sort

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Derive image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=main-${RELEASE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build and push control-plane image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/aws/Dockerfile.control-plane
          # The Dockerfile's last stage is the credential refresher, and buildx
          # builds the last stage when no target is named. Without this line the
          # "control-plane" image ships the refresher ENTRYPOINT (issue #117).
          target: runtime
          platforms: linux/amd64
          build-args: CATS_RELEASE_COMMIT_SHA=${{ env.RELEASE_SHA }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          provenance: false
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane

      # Same Dockerfile, same repository, same digest pinning. The refresher only
      # differs by target, so it cannot drift from the base image the control
      # plane runs, and it carries the shared DSN composition script rather than
      # a second copy of it.
      - name: Build and push credential-refresher image
        id: build_refresher
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/aws/Dockerfile.control-plane
          target: credential-refresher
          platforms: linux/amd64
          build-args: CATS_RELEASE_COMMIT_SHA=${{ env.RELEASE_SHA }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:refresher-${{ steps.meta.outputs.tag }}
          provenance: false
          cache-from: type=gha,scope=credential-refresher
          cache-to: type=gha,mode=max,scope=credential-refresher

      - name: Build and push Route v2 Gateway image
        id: build_gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/aws/Dockerfile.gateway
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:gateway-${{ steps.meta.outputs.tag }}
          provenance: false
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Pin image digest
        id: image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          REFRESHER_DIGEST: ${{ steps.build_refresher.outputs.digest }}
          GATEWAY_DIGEST: ${{ steps.build_gateway.outputs.digest }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REFRESHER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$GATEWAY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${ECR_REGISTRY}/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "refresher_ref=${ECR_REGISTRY}/${ECR_REPOSITORY}@${REFRESHER_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "gateway_ref=${ECR_REGISTRY}/${ECR_REPOSITORY}@${GATEWAY_DIGEST}" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure Terraform and Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in \
            AWS_REGION \
            EXPECTED_AWS_ACCOUNT_ID \
            EXPECTED_AWS_PARTITION \
            EXPECTED_AWS_REGION \
            TF_STATE_BUCKET \
            TF_STATE_APPLICATION_KEY \
            EKS_CLUSTER_NAME \
            PRODUCTION_TFVARS_B64 \
            CHUNKSTORE_BUCKET_NAME \
            CHUNKSTORE_PREFIX \
            CONTROL_POSTGRES_SCHEMA \
            RDS_MASTER_USER_SECRET_ARN \
            ROUTE_V2_CONTROL_ARTIFACT_SECRET_NAME \
            ROUTE_V2_GATEWAY_ARTIFACT_SECRET_NAME \
            RUNTIME_PROVISIONER_TRUST_BUNDLE_B64
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository configuration $name"
              exit 1
            fi
          done
          [[ "$CONTROL_POSTGRES_SCHEMA" =~ ^cats_[a-z0-9_]+$ ]] &&
            (( ${#CONTROL_POSTGRES_SCHEMA} <= 63 )) || {
              echo "::error::CONTROL_POSTGRES_SCHEMA must be one lowercase cats_* PostgreSQL identifier"
              exit 1
            }

          printf '%s' "$PRODUCTION_TFVARS_B64" \
            | base64 --decode > "$RUNNER_TEMP/production.tfvars"
          printf '%s' "$RUNTIME_PROVISIONER_TRUST_BUNDLE_B64" \
            | base64 --decode > "$RUNNER_TEMP/runtime-provisioner-trust.v1.json"
          test "$(wc -c < "$RUNNER_TEMP/runtime-provisioner-trust.v1.json")" -le 16384
          jq -e 'type == "object"' \
            "$RUNNER_TEMP/runtime-provisioner-trust.v1.json" >/dev/null
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --alias "$EKS_CLUSTER_NAME" \
            --kubeconfig "$RUNNER_TEMP/kubeconfig"

          # Inspect only object shape and immutable metadata. Secret data stays
          # in the kubectl-to-jq pipe and is never printed, persisted in
          # Terraform state, or copied into an environment variable.
          kubectl \
            --kubeconfig "$RUNNER_TEMP/kubeconfig" \
            --namespace cats \
            get secret "$ROUTE_V2_CONTROL_ARTIFACT_SECRET_NAME" \
            --output json \
            | jq -e '
                .immutable == true and
                (.data | keys) == [
                  "control-machine-server-certificate.pem",
                  "control-machine-server-private-key.pem",
                  "gateway-client-ca-bundle.pem",
                  "gateway-workload-authority.v1.json",
                  "public-key-ring.v1.json",
                  "rotation-operator-trust.v1.json",
                  "signer-private-key.pem",
                  "signer.v1.json"
                ]
              ' >/dev/null
          kubectl \
            --kubeconfig "$RUNNER_TEMP/kubeconfig" \
            --namespace cats \
            get secret "$ROUTE_V2_GATEWAY_ARTIFACT_SECRET_NAME" \
            --output json \
            | jq -e '
                .immutable == true and
                (.data | keys) == [
                  "gateway-machine-client-certificate.pem",
                  "gateway-machine-client-private-key.pem",
                  "node-server-ca-bundle.pem"
                ]
              ' >/dev/null

          kubectl \
            --kubeconfig "$RUNNER_TEMP/kubeconfig" \
            --namespace cats \
            get secret cats-runtime \
            --output json \
            | jq -c '.data | with_entries(.value |= @base64d)' \
            > "$RUNNER_TEMP/live-secret.json"
          jq -c '
              del(
                .CATS_POSTGRES_URL,
                .CATS_USAGE_STORE_ADAPTER,
                .CATS_USAGE_POSTGRES_URL,
                .CATS_USAGE_POSTGRES_SCHEMA,
                .CATS_USAGE_POSTGRES_WORKERS,
                .CATS_USAGE_POSTGRES_CA_FILE,
                .CATS_USAGE_DELIVERY_ADAPTER,
                .CATS_USAGE_AWS_REGION,
                .CATS_USAGE_KINESIS_STREAM,
                .CATS_USAGE_ARCHIVE_BUCKET,
                .CATS_USAGE_CHECKPOINT_TABLE,
                .STRIPE_SECRET_KEY,
                .STRIPE_WEBHOOK_SECRET,
                .CATS_STRIPE_TOPUP_PRICES,
                .CATS_STRIPE_CHECKOUT_SUCCESS_URL,
                .CATS_STRIPE_CHECKOUT_CANCEL_URL,
                .CATS_STRIPE_LIVEMODE,
                .CATS_BILLING_ENFORCEMENT_ENABLED
              )
            ' "$RUNNER_TEMP/live-secret.json" \
            > "$RUNNER_TEMP/runtime-secret.json"
          kubectl \
            --kubeconfig "$RUNNER_TEMP/kubeconfig" \
            --namespace cats \
            get configmap cats-rds-ca \
            --output jsonpath='{.data.rds-ca\.pem}' \
            > "$RUNNER_TEMP/rds-ca.pem"

          # Take the database password from the one place that holds the
          # current one.
          #
          # This step used to carry CATS_POSTGRES_URL straight out of the live
          # Secret and hand it back to Terraform, so a deployment faithfully
          # reproduced whatever password was already there. When RDS rotated the
          # managed master password, that turned a routine deploy into a total
          # outage: the Pod was replaced, PostgreSQL authenticates on connect,
          # and the fresh process could not get in. Everything except the
          # password still comes from the live Secret -- user, host, port,
          # database, sslmode -- because nothing else rotates.
          aws secretsmanager get-secret-value \
            --secret-id "$RDS_MASTER_USER_SECRET_ARN" \
            --query SecretString \
            --output text \
            > "$RUNNER_TEMP/master-user-secret.json"
          chmod 600 "$RUNNER_TEMP/master-user-secret.json"
          echo "::add-mask::$(jq -er '.password' "$RUNNER_TEMP/master-user-secret.json")"

          postgres_host_args=()
          storage_postgres_session_setup=client
          if [[ -n "${RDS_PROXY_ENDPOINT:-}" ]]; then
            postgres_host_args+=(
              --host "CATS_POSTGRES_URL=$RDS_PROXY_ENDPOINT"
            )
            storage_postgres_session_setup=server-verified
          fi

          python3 deploy/aws/swap-dsn-password.py \
            "$RUNNER_TEMP/live-secret.json" \
            "$RUNNER_TEMP/master-user-secret.json" \
            "${postgres_host_args[@]}" \
            --schema "CATS_POSTGRES_URL=$CONTROL_POSTGRES_SCHEMA" \
            CATS_POSTGRES_URL \
            CATS_USAGE_POSTGRES_URL \
            > "$RUNNER_TEMP/rotated-urls.json"
          chmod 600 "$RUNNER_TEMP/rotated-urls.json"
          jq -erj '.CATS_POSTGRES_URL' "$RUNNER_TEMP/rotated-urls.json" \
            > "$RUNNER_TEMP/proposed-control-postgres-url"
          chmod 600 "$RUNNER_TEMP/proposed-control-postgres-url"

          for key in \
            CATS_POSTGRES_URL \
            CATS_USAGE_POSTGRES_URL
          do
            echo "::add-mask::$(
              jq -er --arg key "$key" '.[$key]' "$RUNNER_TEMP/rotated-urls.json"
            )"
          done
          for key in \
            CATS_POSTGRES_URL \
            CATS_USAGE_POSTGRES_URL \
            STRIPE_SECRET_KEY \
            STRIPE_WEBHOOK_SECRET
          do
            value="$(
              jq -er \
                --arg key "$key" \
                '.[$key]' \
                "$RUNNER_TEMP/live-secret.json"
            )"
            echo "::add-mask::$value"
          done

          # The RDS bundle is larger than Linux's per-environment-variable
          # exec limit. Keep all sensitive Terraform inputs in an ephemeral
          # var file instead of exporting them through GITHUB_ENV.
          jq -n \
            --slurpfile runtime_secret_data "$RUNNER_TEMP/runtime-secret.json" \
            --slurpfile live_secret "$RUNNER_TEMP/live-secret.json" \
            --slurpfile rotated "$RUNNER_TEMP/rotated-urls.json" \
            --rawfile rds_ca_pem "$RUNNER_TEMP/rds-ca.pem" \
            --arg storage_postgres_session_setup "$storage_postgres_session_setup" \
            --rawfile runtime_provisioner_trust_bundle_json "$RUNNER_TEMP/runtime-provisioner-trust.v1.json" \
            '{
              runtime_secret_data: $runtime_secret_data[0],
              runtime_provisioner_trust_bundle_json: $runtime_provisioner_trust_bundle_json,
              storage_postgres_url: $rotated[0].CATS_POSTGRES_URL,
              storage_postgres_session_setup: $storage_postgres_session_setup,
              usage_postgres_url: $rotated[0].CATS_USAGE_POSTGRES_URL,
              stripe_secret_key: $live_secret[0].STRIPE_SECRET_KEY,
              stripe_webhook_secret: $live_secret[0].STRIPE_WEBHOOK_SECRET,
              rds_ca_pem: $rds_ca_pem
            }' \
            > "$RUNNER_TEMP/production-secrets.tfvars.json"
          chmod 600 \
            "$RUNNER_TEMP/live-secret.json" \
            "$RUNNER_TEMP/runtime-secret.json" \
            "$RUNNER_TEMP/rds-ca.pem" \
            "$RUNNER_TEMP/runtime-provisioner-trust.v1.json" \
            "$RUNNER_TEMP/proposed-control-postgres-url" \
            "$RUNNER_TEMP/production-secrets.tfvars.json"

      - name: Check control database compatibility
        shell: bash
        run: |
          set -euo pipefail
          required_schema="$(
            sed -nE \
              's/^pub[[:space:]]+const[[:space:]]+AUTHORITY_RELEASE_SCHEMA_VERSION:[[:space:]]+i64[[:space:]]+=[[:space:]]+([0-9]+);$/\1/p' \
              storage/src/authority.rs
          )"
          if [[ ! "$required_schema" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read AUTHORITY_RELEASE_SCHEMA_VERSION"
            exit 1
          fi

          # The control store lives in PostgreSQL. Probe the proposed fresh
          # DSN, not the live Pod's old Secret. The
          # runner turns the local root-only file into a short-lived Kubernetes
          # Secret so the credential never enters argv or a Pod manifest.
          probe="control-schema-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          selected_schema="$(
            deploy/aws/run-postgres-probe.sh \
              "$RUNNER_TEMP/kubeconfig" \
              cats \
              "${probe}-target" \
              "SELECT current_schema()" \
              "$RUNNER_TEMP/proposed-control-postgres-url"
          )"
          if [[ "$selected_schema" != "$CONTROL_POSTGRES_SCHEMA" ]]; then
            echo "::error::Proposed Control DSN selected schema ${selected_schema:-<none>} instead of $CONTROL_POSTGRES_SCHEMA"
            exit 1
          fi
          set +e
          query_output="$(
            deploy/aws/run-postgres-probe.sh \
              "$RUNNER_TEMP/kubeconfig" \
              cats \
              "$probe" \
              "SELECT version FROM ${CONTROL_POSTGRES_SCHEMA}.control_schema_version" \
              "$RUNNER_TEMP/proposed-control-postgres-url"
          )"
          query_status=$?
          set -e

          if (( query_status == 0 )) && [[ "$query_output" =~ ^[0-9]+$ ]]; then
            actual_schema="$query_output"
            if (( actual_schema != required_schema )); then
              echo "::error::Control database schema $actual_schema does not exactly match build schema $required_schema. Recreate the database with the reviewed clean-slate cutover runbook before retrying. The deployment will not replace the live Pod or delete production data automatically."
              exit 1
            fi
          elif (( query_status != 0 )) && \
            [[ "$query_output" == *'does not exist'* ]] && \
            [[ "$query_output" == *"${CONTROL_POSTGRES_SCHEMA}.control_schema_version"* ]]; then
            echo "Control database has no stamped schema yet; the new Pod creates version $required_schema."
          else
            echo "::error::Could not read the control database schema version (probe exit $query_status): $query_output"
            exit 1
          fi

      - name: Initialize application state
        shell: bash
        run: |
          set -euo pipefail
          terraform \
            -chdir=deploy/aws/terraform/stacks/production-application \
            init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_APPLICATION_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Create GitHub deployment
        id: deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment_id="$(
            jq -n \
              --arg ref "$RELEASE_SHA" \
              '{
                ref: $ref,
                environment: "production",
                auto_merge: false,
                required_contexts: [],
                description: "Manually approved Terraform production deployment"
              }' \
              | gh api \
                  --method POST \
                  "repos/${GITHUB_REPOSITORY}/deployments" \
                  --input - \
                  --jq '.id'
          )"
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Plan production deployment
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          REFRESHER_REF: ${{ steps.image.outputs.refresher_ref }}
          GATEWAY_REF: ${{ steps.image.outputs.gateway_ref }}
        run: |
          set -euo pipefail
          terraform \
            -chdir=deploy/aws/terraform/stacks/production-application \
            plan \
            -input=false \
            -lock-timeout=5m \
            -out="$RUNNER_TEMP/production.tfplan" \
            -var-file="$RUNNER_TEMP/production.tfvars" \
            -var-file="$RUNNER_TEMP/production-secrets.tfvars.json" \
            -var="kubeconfig_path=$RUNNER_TEMP/kubeconfig" \
            -var="kubeconfig_context=$EKS_CLUSTER_NAME" \
            -var="expected_account_id=$EXPECTED_AWS_ACCOUNT_ID" \
            -var="expected_aws_partition=$EXPECTED_AWS_PARTITION" \
            -var="aws_region=$EXPECTED_AWS_REGION" \
            -var="control_plane_image=$IMAGE_REF" \
            -var="gateway_image=$GATEWAY_REF" \
            -var="route_v2_control_artifact_secret_name=$ROUTE_V2_CONTROL_ARTIFACT_SECRET_NAME" \
            -var="route_v2_gateway_artifact_secret_name=$ROUTE_V2_GATEWAY_ARTIFACT_SECRET_NAME" \
            -var="chunkstore_bucket_name=$CHUNKSTORE_BUCKET_NAME" \
            -var="chunkstore_prefix=$CHUNKSTORE_PREFIX" \
            -var="control_postgres_schema=$CONTROL_POSTGRES_SCHEMA" \
            -var="credential_refresher_image=$REFRESHER_REF" \
            -var="database_master_user_secret_arn=$RDS_MASTER_USER_SECRET_ARN"

      - name: Apply reviewed plan
        shell: bash
        run: |
          set -euo pipefail
          terraform \
            -chdir=deploy/aws/terraform/stacks/production-application \
            apply \
            -input=false \
            -auto-approve \
            "$RUNNER_TEMP/production.tfplan"

      - name: Verify rollout and immutable image
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          GATEWAY_REF: ${{ steps.image.outputs.gateway_ref }}
        run: |
          set -euo pipefail
          verify_deployment() {
            deployment=$1
            expected_image=$2
            kubectl \
              --kubeconfig "$RUNNER_TEMP/kubeconfig" \
              --namespace cats \
              rollout status "deployment/$deployment" \
              --timeout=10m
            observed="$(
              kubectl \
                --kubeconfig "$RUNNER_TEMP/kubeconfig" \
                --namespace cats \
                get "deployment/$deployment" \
                --output jsonpath='{.spec.template.spec.containers[0].image}'
            )"
            [[ "$observed" == "$expected_image" ]]
          }
          verify_deployment cats-controld "$IMAGE_REF"
          verify_deployment cats-gatewayd "$GATEWAY_REF"

      - name: Mark deployment successful
        if: success() && steps.deployment.outputs.id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=success \
            -f environment=production \
            -f environment_url=https://cats.run \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Mark deployment failed
        if: failure() && steps.deployment.outputs.id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=failure \
            -f environment=production \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report release
        if: success()
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          GATEWAY_REF: ${{ steps.image.outputs.gateway_ref }}
        run: |
          {
            echo "### Production deployment"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| commit | \`$RELEASE_SHA\` |"
            echo "| image | \`$IMAGE_REF\` |"
            echo "| gateway image | \`$GATEWAY_REF\` |"
            echo "| method | Terraform saved plan + apply |"
          } >> "$GITHUB_STEP_SUMMARY"
