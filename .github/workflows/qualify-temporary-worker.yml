name: Qualify temporary worker (issue 124)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Exact lifecycle transition
        required: true
        type: choice
        options: [provision, validate, drain, withdraw, return]
      confirmation:
        description: Exact confirmation printed by the runbook
        required: true
        type: string
      manifest_sha256:
        description: Canonical manifest SHA-256 (all modes except provision)
        required: false
        type: string
      ttl_hours:
        description: Provisioning TTL, 1 through 24 hours
        required: false
        default: "8"
        type: string

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: issue-124-temporary-worker
  cancel-in-progress: false

jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      Q124_MODE: ${{ inputs.mode }}
      Q124_CONFIRMATION: ${{ inputs.confirmation }}
      Q124_EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      Q124_TTL_HOURS: ${{ inputs.ttl_hours }}
      Q124_ACCOUNT_ID: ${{ vars.Q124_ACCOUNT_ID }}
      Q124_REGION: ${{ vars.AWS_REGION }}
      Q124_CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
      Q124_WORKSPACE_ID: ${{ vars.Q124_WORKSPACE_ID }}
      Q124_SOURCE_INSTANCE_ID: ${{ vars.Q124_SOURCE_INSTANCE_ID }}
      Q124_SOURCE_NODE_ID: ${{ vars.Q124_SOURCE_NODE_ID }}
      Q124_AMI_ID: ${{ vars.Q124_WORKER_AMI_ID }}
      Q124_INSTANCE_TYPE: ${{ vars.Q124_WORKER_INSTANCE_TYPE }}
      Q124_SUBNET_ID: ${{ vars.Q124_WORKER_SUBNET_ID }}
      Q124_SECURITY_GROUP_ID: ${{ vars.Q124_WORKER_SECURITY_GROUP_ID }}
      Q124_INSTANCE_PROFILE_NAME: ${{ vars.Q124_WORKER_INSTANCE_PROFILE }}
      Q124_ARTIFACT_BUCKET: ${{ vars.Q124_WORKER_ARTIFACT_BUCKET }}
      Q124_CACHE_DEVICE: ${{ vars.Q124_WORKER_CACHE_DEVICE }}
      Q124_CONTROL_URL: ${{ vars.Q124_CONTROL_URL }}
      Q124_CHUNKSTORE_BUCKET: ${{ vars.Q124_CHUNKSTORE_BUCKET }}
      Q124_RUNTIME_SECRET_ARN: ${{ vars.Q124_RUNTIME_SECRET_ARN }}
      Q124_DB_SECRET_ARN: ${{ vars.RDS_MASTER_USER_SECRET_ARN }}
      Q124_DB_NAME: ${{ vars.Q124_DB_NAME }}
      Q124_AWS_ROLE_ARN: ${{ vars.Q124_AWS_ROLE_ARN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Initialize private runtime paths
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'Q124_MANIFEST=%s/q124-manifest.json\n' "$RUNNER_TEMP" >>"$GITHUB_ENV"
          printf 'Q124_MANIFEST_OUT=%s/q124-manifest.json\n' "$RUNNER_TEMP" >>"$GITHUB_ENV"
          printf 'Q124_ADMIN_TOKEN_FILE=%s/q124-admin-token\n' "$RUNNER_TEMP" >>"$GITHUB_ENV"

      - name: Reject incomplete or user-controlled scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$Q124_MODE" =~ ^(provision|validate|drain|withdraw|return)$ ]]
          required=(Q124_AWS_ROLE_ARN Q124_ACCOUNT_ID Q124_REGION Q124_CLUSTER Q124_WORKSPACE_ID Q124_SOURCE_INSTANCE_ID Q124_SOURCE_NODE_ID Q124_CONTROL_URL Q124_AMI_ID Q124_INSTANCE_TYPE Q124_SUBNET_ID Q124_SECURITY_GROUP_ID Q124_INSTANCE_PROFILE_NAME Q124_CACHE_DEVICE)
          if [[ "$Q124_MODE" == provision ]]; then
            required+=(Q124_ARTIFACT_BUCKET Q124_CHUNKSTORE_BUCKET Q124_RUNTIME_SECRET_ARN Q124_DB_SECRET_ARN Q124_DB_NAME)
            [[ "$Q124_TTL_HOURS" =~ ^([1-9]|1[0-9]|2[0-4])$ ]]
          else
            [[ "$Q124_EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "::error::missing repository variable $name"; exit 1; }
          done

      # The ordinary release identity is used only for the existing EKS
      # read. It has no EC2/SSM mutation authority.
      - name: Read administrator token with release identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.Q124_REGION }}
      - name: Fetch scoped administrator token
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          aws eks update-kubeconfig --name "$Q124_CLUSTER" --region "$Q124_REGION" --kubeconfig "$RUNNER_TEMP/kubeconfig"
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" -n cats get secret cats-runtime \
            -o jsonpath='{.data.CATS_ADMIN_TOKEN}' | base64 --decode >"$Q124_ADMIN_TOKEN_FILE"
          [[ -s "$Q124_ADMIN_TOKEN_FILE" ]]
          chmod 600 "$Q124_ADMIN_TOKEN_FILE"
          echo "::add-mask::$(<"$Q124_ADMIN_TOKEN_FILE")"

      - name: Assume dedicated qualification identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.Q124_AWS_ROLE_ARN }}
          aws-region: ${{ env.Q124_REGION }}

      - name: Package exact reviewed source
        if: inputs.mode == 'provision'
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar "$GITHUB_SHA" | gzip -n >"$RUNNER_TEMP/q124-source.tar.gz"
          archive_sha=$(sha256sum "$RUNNER_TEMP/q124-source.tar.gz" | awk '{print $1}')
          key="worker/qualification-124/${GITHUB_SHA}/q124-source-${archive_sha}.tar.gz"
          aws s3 cp "$RUNNER_TEMP/q124-source.tar.gz" "s3://${Q124_ARTIFACT_BUCKET}/${key}" --only-show-errors
          printf 'Q124_ARCHIVE_SHA256=%s\nQ124_ARCHIVE_KEY=%s\n' "$archive_sha" "$key" >>"$GITHUB_ENV"

      - name: Recover exact no-secret manifest
        if: inputs.mode != 'provision'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker="<!-- cats-q124-manifest:${Q124_EXPECTED_MANIFEST_SHA256} -->"
          mapfile -t bodies < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/124/comments" --jq ".[] | select(.body | contains(\"$marker\")) | .body")
          [[ ${#bodies[@]} == 1 ]] || { echo "::error::manifest comment was not unique"; exit 1; }
          encoded=$(sed -n 's/^q124-manifest-base64: //p' <<<"${bodies[0]}")
          [[ -n "$encoded" ]]
          printf '%s' "$encoded" | base64 --decode >"$Q124_MANIFEST"
          actual=$(jq -S -c . "$Q124_MANIFEST" | sha256sum | awk '{print $1}')
          [[ "$actual" == "$Q124_EXPECTED_MANIFEST_SHA256" ]]

      - name: Execute exact lifecycle transition
        id: lifecycle
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 deploy/aws/qualification/*.sh
          output=$(deploy/aws/qualification/q124-temp-worker.sh)
          printf '%s\n' "$output"
          manifest_sha=$(sed -n 's/^manifest-sha256=//p' <<<"$output")
          [[ -z "$manifest_sha" || "$manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "manifest_sha=$manifest_sha" >>"$GITHUB_OUTPUT"

      - name: Publish no-secret manifest evidence
        if: inputs.mode == 'provision' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA: ${{ steps.lifecycle.outputs.manifest_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          canonical=$(jq -S -c . "$Q124_MANIFEST_OUT")
          [[ $(printf '%s\n' "$canonical" | sha256sum | awk '{print $1}') == "$MANIFEST_SHA" ]]
          encoded=$(printf '%s\n' "$canonical" | base64 -w0)
          body=$(printf '<!-- cats-q124-manifest:%s -->\nq124-manifest-base64: %s\n\nProvisioned manifest (contains identifiers, no credentials):\n```json\n%s\n```\n' "$MANIFEST_SHA" "$encoded" "$(jq . "$Q124_MANIFEST_OUT")")
          gh api "repos/${GITHUB_REPOSITORY}/issues/124/comments" -f body="$body" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'provision'
        with:
          name: q124-temporary-worker-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/q124-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove runner-local credentials and staging files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            "$RUNNER_TEMP/q124-admin-token" \
            "$RUNNER_TEMP/q124-source.tar.gz" \
            "$RUNNER_TEMP/q124-manifest.json" \
            "$RUNNER_TEMP/kubeconfig"
          do
            [[ "$path" == "$RUNNER_TEMP"/* ]]
            if [[ -f "$path" && ! -L "$path" ]]; then
              chmod 600 "$path"
              truncate -s 0 "$path"
              unlink "$path"
            fi
          done
