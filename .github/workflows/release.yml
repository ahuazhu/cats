name: Release

# Builds the three reviewed production artifacts:
#
#   * the control-plane container image (cats-controld only), pushed to ECR;
#     its immutable digest is what the application stack's tfvars must
#     reference.
#   * the credential-refresher container image, built from its independent
#     Docker target and reported under a distinct digest-pinned tag.
#   * the metal worker bundle (host binaries, guest-agent + guest units, seed
#     updater and the worker systemd unit) as a tar.zst plus SHA-256, which the
#     infrastructure stack uploads to the content-addressed artifact bucket.
#
# Authentication is GitHub OIDC into an AWS role; no long-lived access key is
# stored in the repository. The role is created by the platform stack.
#
# Required repository variables (Settings -> Secrets and variables -> Actions):
#   AWS_REGION                e.g. us-east-1 (the configure-aws-credentials input)
#   EXPECTED_AWS_ACCOUNT_ID   exact 12-digit release account
#   EXPECTED_AWS_PARTITION    e.g. aws
#   EXPECTED_AWS_REGION       independently reviewed target region
#   AWS_ROLE_ARN              release role in that exact account/partition
#   ECR_REPOSITORY            cats/control-plane

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the control-plane and credential-refresher images to ECR
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  CARGO_TERM_COLOR: always
  AWS_REGION: ${{ vars.AWS_REGION }}
  EXPECTED_AWS_ACCOUNT_ID: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
  EXPECTED_AWS_PARTITION: ${{ vars.EXPECTED_AWS_PARTITION }}
  EXPECTED_AWS_REGION: ${{ vars.EXPECTED_AWS_REGION }}

jobs:
  aws-target:
    name: Verify release AWS target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Require reviewed AWS target
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION EXPECTED_AWS_ACCOUNT_ID EXPECTED_AWS_PARTITION EXPECTED_AWS_REGION; do
            test -n "${!name:-}" || {
              echo "::error::Missing required repository variable $name"
              exit 1
            }
          done

      - name: Assume AWS release role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify release AWS target
        run: |
          python3 deploy/aws/verify-aws-target.py \
            --expected-account-id "$EXPECTED_AWS_ACCOUNT_ID" \
            --expected-partition "$EXPECTED_AWS_PARTITION" \
            --expected-region "$EXPECTED_AWS_REGION"

  guest-runtime-release:
    name: Shared Guest runtime release
    needs: aws-target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the one Guest payload
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -qy busybox-static cpio zstd gzip e2fsprogs debootstrap musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release -p cats-guest-agent --target x86_64-unknown-linux-musl
          sudo env \
            HOME=/root \
            GUEST_AGENT_BIN="$PWD/target/x86_64-unknown-linux-musl/release/cats-guest-agent" \
            OUT="$RUNNER_TEMP/guest-build" \
            RELEASE_OUT="$PWD/guest-runtime-release.v1" \
            deploy/metal/build-guest-image.sh
          sudo chown -R "$USER:$USER" guest-runtime-release.v1
          find guest-runtime-release.v1 -type f -exec sha256sum {} + | LC_ALL=C sort
      - uses: actions/upload-artifact@v4
        with:
          name: guest-runtime-release-v1
          path: guest-runtime-release.v1
          if-no-files-found: error
          retention-days: 1

  control-plane-image:
    name: Control-plane image
    needs: [aws-target, guest-runtime-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: guest-runtime-release-v1
          path: guest-runtime-release.v1

      - name: Derive image tag
        id: meta
        run: |
          ref_tag="$(printf '%s' "$GITHUB_REF_NAME" | tr -c '[:alnum:]_.-' '-')"
          ref_tag="${ref_tag:0:100}"
          echo "tag=${ref_tag}-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Assume AWS role
        if: github.event_name != 'workflow_dispatch' || inputs.push_image
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reverify release AWS target before registry access
        if: github.event_name != 'workflow_dispatch' || inputs.push_image
        run: |
          python3 deploy/aws/verify-aws-target.py \
            --expected-account-id "$EXPECTED_AWS_ACCOUNT_ID" \
            --expected-partition "$EXPECTED_AWS_PARTITION" \
            --expected-region "$EXPECTED_AWS_REGION"

      - name: Log in to ECR
        if: github.event_name != 'workflow_dispatch' || inputs.push_image
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The runtime is linux/amd64 (EKS Auto Mode general-purpose nodes), so the
      # platform is pinned rather than inherited from the runner.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/aws/Dockerfile.control-plane
          target: runtime
          platforms: linux/amd64
          build-args: CATS_RELEASE_COMMIT_SHA=${{ github.sha }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
          tags: ${{ steps.ecr.outputs.registry && format('{0}/{1}:{2}', steps.ecr.outputs.registry, vars.ECR_REPOSITORY, steps.meta.outputs.tag) || format('cats-control-plane:{0}', steps.meta.outputs.tag) }}
          provenance: false
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane

      # tfvars requires an immutable @sha256 reference. Reading the digest back
      # from the registry is deliberate: never copy a digest from a previous
      # build or another account.
      - name: Report image reference
        if: github.event_name != 'workflow_dispatch' || inputs.push_image
        run: |
          {
            echo "### Control-plane image"
            echo
            echo '```'
            echo "${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  credential-refresher-image:
    name: Credential refresher image
    needs: [aws-target, guest-runtime-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: guest-runtime-release-v1
          path: guest-runtime-release.v1

      - name: Derive credential-refresher image tag
        id: meta
        run: echo "tag=refresher-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Assume AWS role
        if: github.event_name != 'workflow_dispatch' || inputs.push_image
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reverify release AWS target before registry access
        if: github.event_name != 'workflow_dispatch' || inputs.push_image
        run: |
          python3 deploy/aws/verify-aws-target.py \
            --expected-account-id "$EXPECTED_AWS_ACCOUNT_ID" \
            --expected-partition "$EXPECTED_AWS_PARTITION" \
            --expected-region "$EXPECTED_AWS_REGION"

      - name: Log in to ECR
        if: github.event_name != 'workflow_dispatch' || inputs.push_image
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push credential refresher
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/aws/Dockerfile.control-plane
          target: credential-refresher
          platforms: linux/amd64
          build-args: CATS_RELEASE_COMMIT_SHA=${{ github.sha }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
          tags: ${{ steps.ecr.outputs.registry && format('{0}/{1}:{2}', steps.ecr.outputs.registry, vars.ECR_REPOSITORY, steps.meta.outputs.tag) || format('cats-credential-refresher:{0}', steps.meta.outputs.tag) }}
          provenance: false
          cache-from: type=gha,scope=credential-refresher
          cache-to: type=gha,mode=max,scope=credential-refresher

      - name: Report credential-refresher image reference
        if: github.event_name != 'workflow_dispatch' || inputs.push_image
        run: |
          {
            echo "### Credential-refresher image"
            echo
            echo '```'
            echo "${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  worker-bundle:
    name: Metal worker bundle
    needs: [aws-target, guest-runtime-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: guest-runtime-release-v1
          path: guest-runtime-release.v1

      - uses: docker/setup-buildx-action@v3

      # Dockerfile.worker-artifact's final stage is FROM scratch, so exporting
      # it to the local filesystem yields exactly the reviewed release payload.
      - name: Build worker binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/aws/Dockerfile.worker-artifact
          target: artifact
          platforms: linux/amd64
          build-args: CATS_RELEASE_COMMIT_SHA=${{ github.sha }}
          outputs: type=local,dest=worker-out
          provenance: false
          cache-from: type=gha,scope=worker-bundle
          cache-to: type=gha,mode=max,scope=worker-bundle

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          ls -l worker-out
          tar --owner=0 --group=0 --numeric-owner -C worker-out -cf - . \
            | zstd -19 -T0 -o cats-worker.tar.zst
          tar --zstd -tvf cats-worker.tar.zst \
            | awk '$NF == "./install-guest-runtime-release.sh" && substr($1,1,4) == "-rwx" { found=1 } END { exit !found }'
          sha256=$(sha256sum cats-worker.tar.zst | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### Worker bundle"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| file | \`cats-worker.tar.zst\` |"
            echo "| sha256 | \`$sha256\` |"
            echo
            echo "Before Terraform apply, run \`cats admin node drain <node-id>\`"
            echo "and wait until \`cats admin node get <node-id>\` reports"
            echo "\`state=cordoned cats=0\`. Set \`worker_bundle_path\` to the"
            echo "downloaded file and \`worker_bundle_sha256\` to the digest above."
            echo "After the association succeeds, run"
            echo "\`cats admin node uncordon <node-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: cats-worker-bundle
          path: cats-worker.tar.zst
          if-no-files-found: error
