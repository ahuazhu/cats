name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # native-tls needs OpenSSL headers; rusqlite is `bundled` and compiles
      # SQLite from source, so it only needs a C toolchain.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      # No `cargo fmt --check` gate: the workspace is not currently
      # rustfmt-clean (74 diffs across 19 files) and AGENTS.md defines the
      # quality gates as clippy + test only. Reformat in a dedicated commit
      # first, then add the gate here.

      # `cargo build` must come first: some integration tests shell out to
      # `cargo build` for helper binaries and would otherwise deadlock on the
      # build-directory lock (AGENTS.md).
      - name: Build
        run: cargo build --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Runs on Linux, so the vhost-user-blk and node-agent code that compiles
      # out on macOS is covered here. Benchmarks are `#[ignore]` and excluded;
      # `s3_live` skips itself unless CATS_AWS_S3_TEST_ENDPOINT is set.
      - name: Test
        run: cargo test --workspace --locked

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive deploy/aws/terraform

      # No backend and no credentials: this validates configuration only and
      # never contacts or mutates AWS.
      - name: Validate stacks
        run: |
          set -euo pipefail
          for dir in \
            bootstrap \
            stacks/platform \
            stacks/production-infrastructure \
            stacks/production-payments \
            stacks/production-application
          do
            if [ ! -d "deploy/aws/terraform/$dir" ]; then
              echo "skip missing $dir"
              continue
            fi
            echo "::group::$dir"
            terraform -chdir="deploy/aws/terraform/$dir" init -backend=false
            terraform -chdir="deploy/aws/terraform/$dir" validate
            echo "::endgroup::"
          done
