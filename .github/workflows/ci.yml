name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CATS_CARGO_DENY_VERSION: 0.19.4
  CATS_CARGO_MACHETE_VERSION: 0.9.2

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The control store is PostgreSQL-only; its tests fail loudly without a
    # server rather than silently skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CATS_TEST_POSTGRES_URL: postgres://postgres:cats@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt

      - name: Install dependency policy tools
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-deny@${{ env.CATS_CARGO_DENY_VERSION }},cargo-machete@${{ env.CATS_CARGO_MACHETE_VERSION }}
          fallback: none

      - uses: Swatinem/rust-cache@v2

      # native-tls needs OpenSSL headers; rusqlite is `bundled` and compiles
      # SQLite from source, so it only needs a C toolchain.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev e2fsprogs

      - name: Agent skill contracts
        run: ./scripts/quality.sh skills

      - name: Dependency policy
        run: ./scripts/quality.sh deps

      - name: Formatting
        run: ./scripts/quality.sh fmt

      - name: Check
        run: ./scripts/quality.sh check

      # `cargo build` must come first: some integration tests shell out to
      # `cargo build` for helper binaries and would otherwise deadlock on the
      # build-directory lock (AGENTS.md).
      - name: Build
        run: ./scripts/quality.sh build

      - name: Clippy
        run: ./scripts/quality.sh clippy

      # Runs on Linux, so the vhost-user-blk and node-agent code that compiles
      # out on macOS is covered here. Benchmarks are `#[ignore]` and excluded;
      # `s3_live` skips itself unless CATS_AWS_S3_TEST_ENDPOINT is set.
      - name: Test
        run: ./scripts/quality.sh test

      - name: Documentation
        run: ./scripts/quality.sh doc

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive deploy/aws/terraform

      # No backend and no credentials: this validates configuration only and
      # never contacts or mutates AWS.
      - name: Validate stacks
        run: |
          set -euo pipefail
          for dir in \
            bootstrap \
            stacks/platform \
            stacks/production-infrastructure \
            stacks/production-payments \
            stacks/production-application
          do
            if [ ! -d "deploy/aws/terraform/$dir" ]; then
              echo "skip missing $dir"
              continue
            fi
            echo "::group::$dir"
            terraform -chdir="deploy/aws/terraform/$dir" init -backend=false
            terraform -chdir="deploy/aws/terraform/$dir" validate
            echo "::endgroup::"
          done

      - name: Deployment and Terraform contracts
        run: |
          terraform -chdir=deploy/aws/terraform/modules/usage-infrastructure init -backend=false
          terraform -chdir=deploy/aws/terraform/modules/usage-infrastructure test
          terraform -chdir=deploy/aws/terraform/modules/metal-worker-deployment init -backend=false
          terraform -chdir=deploy/aws/terraform/modules/metal-worker-deployment test
          terraform -chdir=deploy/aws/terraform/stacks/production-infrastructure test
          terraform -chdir=deploy/aws/terraform/stacks/production-application test
          python3 deploy/aws/terraform/test-alert-recipient-privacy.py
          python3 deploy/aws/preflight-alarm-recipients-fixture.py
          python3 deploy/aws/run-controlled-alarm-recipient-test-fixture.py
          python3 deploy/aws/verify-aws-target-fixture.py
          python3 deploy/aws/tools/manual-image-reference-fixture.py \
            --builder deploy/aws/tools/build-manual-release.sh
          python3 deploy/aws/tools/image-transport-fixture.py \
            --verifier deploy/aws/tools/verify-image-transport.py
          python3 deploy/aws/tools/manual-release-fixture.py \
            --verifier deploy/aws/tools/verify-manual-release.py
          python3 deploy/aws/route-v2-node-r1-install-fixture.py \
            --helper deploy/aws/metal/install-route-v2-node-r1.sh \
            --manual-installer deploy/aws/metal/install-worker.sh \
            --terraform-module deploy/aws/terraform/modules/metal-worker-deployment/main.tf
          sudo python3 deploy/aws/systemd-route-v2-effective-argv-fixture.py \
            --production-unit deploy/aws/metal/cats-worker.service \
            --direct-unit deploy/metal/systemd/cats-noded.service
