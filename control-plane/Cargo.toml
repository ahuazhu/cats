[package]
name = "cats-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["proposed-node-residue-reclamation"]
proposed-node-residue-reclamation = [
    "cats-api/proposed-node-residue-reclamation",
    "cats-storage/proposed-node-residue-reclamation",
]
# Explicitly opt-in fixture composition for cross-crate E2E tests. Release
# binaries do not enable this feature.
test-support = []

[dependencies]
cats-api = { workspace = true }
cats-metering = { workspace = true }
cats-storage = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
postgres = { workspace = true }
postgres-native-tls = { workspace = true }
native-tls = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
workos = { workspace = true }
jsonwebtoken = { workspace = true }
ring = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
tungstenite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
cats-test-support = { workspace = true }
base64 = { workspace = true }
loom = { workspace = true }

[lints]
workspace = true
