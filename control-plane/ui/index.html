<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Cats Console</title>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body class="portal-page">
  <main class="portal-shell">
    <header class="portal-header">
      <a class="brand brand-large" href="/" aria-label="Cats Console home">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span><strong>Cats</strong><small>Control plane</small></span>
      </a>
      <span class="status-chip"><i></i> API online</span>
    </header>

    <section class="portal-hero">
      <div class="eyebrow">Choose your workspace</div>
      <h1>一套控制面，两个清晰入口。</h1>
      <p>用户只管理所属 Project 的计算与存储资源；平台管理员独立查看节点、容量与运行健康。</p>
    </section>

    <section class="site-grid" aria-label="Console sites">
      <a class="site-card user-site" href="/user/">
        <span class="site-icon" aria-hidden="true">⌁</span>
        <span class="site-copy">
          <small>PROJECT CONSOLE</small>
          <strong>用户控制台</strong>
          <span>创建和管理 Cats、Persistent Disks，跟踪异步 Operations。</span>
        </span>
        <span class="site-arrow" aria-hidden="true">→</span>
      </a>
      <a class="site-card admin-site" href="/admin/">
        <span class="site-icon" aria-hidden="true">⌘</span>
        <span class="site-copy">
          <small>FLEET CONSOLE</small>
          <strong>管理员控制台</strong>
          <span>监控集群容量与生命周期，管理、排空和下线工作节点。</span>
        </span>
        <span class="site-arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <footer class="portal-footer">
      <span>Cats V1 development console</span>
      <a href="/healthz">Health check</a>
    </footer>
  </main>
</body>
</html>
