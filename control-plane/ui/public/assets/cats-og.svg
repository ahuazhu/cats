<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cats — durable cloud workspaces</title>
  <desc id="desc">Linux microVM workspaces that sleep, wake, and keep their disks.</desc>
