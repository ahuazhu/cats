[package]
name = "cats-node-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["proposed-node-residue-reclamation"]
# Kept as a compatibility feature name while N2 is the default production
# scanner, A20 wire and residue-authority client shape.
proposed-node-residue-reclamation = [
    "cats-api/proposed-node-residue-reclamation",
    "cats-storage/proposed-node-residue-reclamation",
]

[dependencies]
cats-api = { workspace = true }
cats-block-client = { workspace = true }
cats-blockd = { workspace = true }
cats-metering = { workspace = true }
cats-storage = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rusqlite = { workspace = true }
uuid = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
bytes = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# The Node mints its own attachment-scoped object-write Ed25519 keypairs. `ring`
# is already the workspace's only Ed25519 implementation (it backs
# `cats_api::agent_registration::Ed25519RequestSigner`), so generating the key
# with anything else would introduce a second signature stack for one keypair.
ring = { workspace = true }

[dev-dependencies]
cats-object-store-gateway = { workspace = true }
cats-test-support = { workspace = true }
cats-control-plane = { workspace = true, features = ["test-support"] }
cats-network = { workspace = true, features = ["test-support"] }
# The stub control planes in `tests/control_plane_connection.rs` and
# `tests/heartbeat_independence.rs` need a real `MetadataStore` for
# `ServerConfig`; this is the workspace's SQLite adapter.
cats-metadata-store-sqlite = { workspace = true }
cats-object-store-file = { workspace = true }
tempfile = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
cats-metadata-store-postgres = { workspace = true }
cats-object-store-aws-s3 = { workspace = true }
cats-blockd = { workspace = true, features = ["test-vhost-user-frontend"] }
vhost = { workspace = true, features = ["vhost-user-frontend"] }

[lints]
workspace = true
