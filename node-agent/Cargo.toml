[package]
name = "cats-node-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["proposed-node-residue-reclamation"]
# Kept as a compatibility feature name while N2 is the default production
# scanner, A20 wire and residue-authority client shape.
proposed-node-residue-reclamation = [
    "cats-api/proposed-node-residue-reclamation",
    "cats-storage/proposed-node-residue-reclamation",
]

[dependencies]
cats-api = { workspace = true }
cats-blockd = { workspace = true }
cats-metering = { workspace = true }
cats-storage = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
uuid = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
cats-test-support = { workspace = true }
cats-control-plane = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
cats-blockd = { workspace = true, features = ["test-vhost-user-frontend"] }

[lints]
workspace = true
