[package]
name = "cats-node-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cats-api = { workspace = true }
cats-block-client = { workspace = true }
cats-blockd = { workspace = true }
cats-metering = { workspace = true }
cats-storage = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rusqlite = { workspace = true }
uuid = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }

[dev-dependencies]
cats-test-support = { workspace = true }
ring = { workspace = true }
# The stub control planes in `tests/control_plane_connection.rs` and
# `tests/heartbeat_independence.rs` need a real `MetadataStore` for
# `ServerConfig`; this is the workspace's SQLite adapter.
cats-metadata-store-sqlite = { workspace = true }
cats-object-store-file = { workspace = true }
tempfile = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
vhost = { workspace = true, features = ["vhost-user-frontend"] }

[lints]
workspace = true
