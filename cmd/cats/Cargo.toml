[package]
name = "cats-cli"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
description = "Command-line client for the Cats microVM platform"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["microvm", "virtualization", "cli"]
publish = ["crates-io"]

[[bin]]
name = "cats"
path = "src/main.rs"

[dependencies]
cats-api = { workspace = true }
cats-protocol = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
tokio = { workspace = true }
directories = { workspace = true }
open = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
crossterm = { workspace = true }
fs2 = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
ring = { workspace = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { workspace = true }

[dev-dependencies]
cats-test-support = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
