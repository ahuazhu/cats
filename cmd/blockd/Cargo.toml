[package]
name = "cats-blockd-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cats-blockd"
path = "src/main.rs"
# The binary name normalizes to the `cats_blockd` library's rustdoc output
# directory. Document the library API and avoid a Cargo output collision.
doc = false

[dependencies]
cats-api = { workspace = true }
cats-blockd = { workspace = true }
cats-storage = { workspace = true }
cats-object-store-file = { workspace = true }
cats-object-store-aws-s3 = { workspace = true }
cats-metadata-store-sqlite = { workspace = true }
cats-metadata-store-postgres = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The vhost-user listener type is only reachable on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
vhost = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
