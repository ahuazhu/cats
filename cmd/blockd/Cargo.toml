[package]
name = "cats-blockd-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cats-blockd"
path = "src/main.rs"
# The binary name normalizes to the `cats_blockd` library's rustdoc output
# directory. Document the library API and avoid a Cargo output collision.
doc = false

[dependencies]
cats-api = { workspace = true }
cats-blockd = { workspace = true }
cats-storage = { workspace = true }
cats-object-store-file = { workspace = true }
cats-object-store-aws-s3 = { workspace = true }
# Production workers are IAM-denied direct ChunkStore mutation, so blockd needs
# the Gateway write transport in its composition root; there is no other way to
# publish an immutable object for a credential-bearing attachment.
cats-object-store-gateway = { workspace = true }
cats-metadata-store-postgres = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }

# The vhost-user listener type is only reachable on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
vhost = { workspace = true }

[dev-dependencies]
cats-metadata-store-sqlite = { workspace = true }
cats-test-support = { workspace = true }
tempfile = { workspace = true }
# Object-write credential fixtures mint one real Ed25519 key and encode the
# exact canonical PKCS#8 v2 PEM and SPKI the Node publishes.
ring = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
