[package]
name = "cats-api"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "Shared API and protocol types for the Cats microVM platform"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["microvm", "virtualization", "api"]
publish = ["crates-io"]

[features]
default = ["proposed-node-residue-reclamation"]
# Kept as a compatibility feature name while the exact N2 wire is the default
# production shape. A no-default-features build exercises only the retired
# pre-N2 decoder and is not a deployable Runtime protocol.
proposed-node-residue-reclamation = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
