[package]
name = "cats-api"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "Public HTTP API types for the Cats microVM platform"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["microvm", "virtualization", "api"]
publish = ["crates-io"]

[dependencies]
cats-protocol = { workspace = true, optional = true }
cats-artifacts = { workspace = true, optional = true }
serde = { workspace = true }

[features]
default = ["protocol-compat", "artifacts-compat"]
protocol-compat = ["dep:cats-protocol"]
artifacts-compat = ["protocol-compat", "dep:cats-artifacts"]

[lints]
workspace = true
