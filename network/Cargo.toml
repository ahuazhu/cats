[package]
name = "cats-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cats-gatewayd"
path = "src/main.rs"

[features]
default = []
# Explicitly opt-in test fixture composition for cross-crate E2E tests. The
# shipped Gateway binary never enables this feature.
test-support = []

[dependencies]
cats-api = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }

[dev-dependencies]
cats-test-support = { workspace = true }

[lints]
workspace = true
